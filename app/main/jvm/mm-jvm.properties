# jpackage --add-launcher: the JVM build of mm (app/main/cli), started on the runtime the installer bundles.
main-class=com.moneymanager.cli.MainKt
# Mordant reads the terminal through the foreign function API. Libraries' SLF4J logs go to stderr only
# (log4j2-mm.xml), never to stdout with the result.
java-options=--enable-native-access=ALL-UNNAMED -Dlog4j2.configurationFile=classpath:log4j2-mm.xml
win-console=true
win-shortcut=false
win-menu=false
linux-shortcut=false
