[versions]
# Android API level sync: keep target SDK and the CI emulators aligned. Compile SDK runs ahead: androidx Compose 1.12 requires
# compiling against API 37, which is only a compile-time floor and needs no emulator/runtime move.
android-compileSdk = "37"
android-gradle-plugin = "9.4.1"
# The lint AGP runs (com.android.tools.lint:lint-gradle), whose version is always AGP's + 23: Bazel's Android lint (#1025).
android-lint = "32.4.1"
android-minSdk = "30"
android-targetSdk = "36"
play-services-auth = "22.0.0"
androidx-activity-compose = "1.13.0"
# Transitive-alignment versions: pin divergent androidx/kotlinx transitive deps to the
# version the assembled app resolves to (MODULE.bazel's maven_kmp `forces`).
androidx-annotation = "1.9.1"
androidx-collection = "1.5.0"
androidx-concurrent-futures = "1.2.0"
androidx-lifecycle = "2.10.0"
androidx-navigationevent = "1.1.2"
androidx-savedstate = "1.5.0"
androidx-test-services-storage = "1.6.0"
androidx-tracing = "1.2.0"
atomicfu = "0.33.0"
jetbrains-annotations = "23.0.0"
androidx-compose = "1.12.1"
androidx-compose-material-icons = "1.7.8"
androidx-compose-material3 = "1.4.0"
androidx-navigation3 = "1.2.0"
jetbrains-navigation3 = "1.1.2"
androidx-sqlite = "2.7.1"
androidx-test-monitor = "1.8.0"
androidx-test-runner = "1.7.0"
androidx-test-uiautomator = "2.4.0"
bignum = "0.3.10"
clikt = "5.1.0"
compose-charts = "1.0.0"
compose-plugin = "1.12.2"
compose-material-icons-desktop = "1.7.3"
compose-material3-desktop = "1.9.0"
cryptography = "0.6.0"
detekt = "2.0.0-alpha.6"
dokka = "2.2.0"
kermit = "2.2.0"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-io = "0.9.1"
kotlinx-serialization = "1.11.0"
ktlint = "14.2.0"
# The ktlint engine Bazel's `@ktlint_cli` resolves (#1015).
ktlint-engine = "1.5.0"
ktor = "3.6.0"
log4j = "2.26.1"
mappie = "2.4.21-2.4.5"
mordant = "3.1.0"
mosaic = "0.18.0"
poi = "5.5.1"
proguard = "7.8.2"
junit = "4.13.2"
metro = "1.4.5"
mokkery = "3.5.1"
molecule = "2.2.0"
schemaspy = "7.0.2"
slf4j = "2.0.20"
sqldelight = "2.4.1"
# The SQLite the native targets link statically (utils/sqlite3). The release number in sqlite.org's
# download naming (3.54.0 = 3540000), its year directory, and the zip's SHA-256 move together.
sqlite-amalgamation-release = "3540000"
sqlite-amalgamation-year = "2026"
sqlite-amalgamation-sha256 = "68e913b0fe8ec6b4e5f391c594a28872884e80d6cd042a1e50c957be46b5aa4d"
test-retry = "1.6.6"
turbine = "1.2.1"
# Build-tool transitive-alignment versions: pin tooling transitives (compiler plugins, AGP's tools) to
# one version in every resolution. Consumed via the build-tool-pins bundle (maven_kmp's `force_bundles`).
buildtool-animal-sniffer = "1.28"
buildtool-asm = "9.11.1"
buildtool-checker-qual = "4.3.1"
buildtool-commons-io = "2.22.0"
buildtool-errorprone = "2.50.0"
buildtool-grpc = "1.85.0"
buildtool-gson = "2.14.0"
buildtool-guava = "33.7.2-jre"
buildtool-guava-failureaccess = "1.0.3"
buildtool-httpclient = "4.5.14"
buildtool-j2objc = "3.1"
buildtool-javawriter = "2.5.1"
buildtool-jsr305 = "3.0.2"
buildtool-kotlinpoet = "2.4.0"
buildtool-logback = "1.6.5"
buildtool-netty = "4.2.19.Final"
buildtool-perfmark = "0.27.0"
buildtool-poko = "0.23.2"
buildtool-proto-google-common-protos = "2.78.0"
buildtool-protobuf = "4.36.2"
buildtool-tink = "1.24.0"

