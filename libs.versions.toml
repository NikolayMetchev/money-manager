# Transitive pins — consumed only as the transitive-pins bundle for dependency substitution (not declared as
# dependencies). Keep alphabetized with the bundle below.
pin-commons-io = { module = "commons-io:commons-io", version.ref = "pin-commons-io" }
pin-errorprone = { module = "com.google.errorprone:error_prone_annotations", version.ref = "pin-errorprone" }
pin-javawriter = { module = "com.squareup:javawriter", version.ref = "pin-javawriter" }
pin-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "pin-jsr305" }
pin-poko-annotations = { module = "dev.drewhamilton.poko:poko-annotations", version.ref = "pin-poko" }

[bundles]
# Transitive deps pinned to one version in every resolution (maven_kmp's `force_bundles`). NOTE: compose-internal annotation/collection are deliberately NOT pinned — forcing
# them desyncs the Compose runtime and breaks Compose UI tests. Kotlin compiler/stdlib/reflect and
# dagger are also excluded (each plugin needs its own compatible version).
transitive-pins = [
    "pin-commons-io",
    "pin-errorprone",
    "pin-javawriter",
    "pin-jsr305",
    "pin-poko-annotations",
]
