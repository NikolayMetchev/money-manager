# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

# Build and Test uploads one coverage report per commit (`unit`: the Kotlin JVM and Android host tests under the
# IntelliJ coverage engine, `bazel/kmp/testing/coverage.sh`). The instrumented job uploads test results only, which don't count as a build, so waiting
# for a second upload would hold back the PR comment and status forever.
codecov:
  notify:
    after_n_builds: 1

flags:
  unit:
    after_n_builds: 1

# A line that ran counts as covered even when some of its bytecode branches didn't. Every composable's opening line
# carries the Compose compiler's skip checks (`Composer.changed`, `shouldExecute`), and which of them a test takes
# depends on how often the UI happened to recompose, so a dependency bump could fail codecov/project on noise.
parsers:
  jacoco:
    partials_as_hits: true

comment:
  layout: "header, diff, flags, components"
  require_changes: false

# Code only a device or emulator runs (SharedPreferences, the Storage Access Framework): the coverage run is the JVM
# and Android host tests, which never reach it, so it would only count against the patch and project targets.
# Native source sets need no entry: no coverage run instruments them, so they never reach the report.
# The desktop and Android entry points are the same: no test starts the app through main() or its Activity.
ignore:
  - "**/src/androidMain/**"
  - "app/main/jvm/src/main/**"
  - "app/main/android/src/main/**"
