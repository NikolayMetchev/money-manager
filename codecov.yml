# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

# Build and Test uploads one coverage report per commit (`unit`: the Kotlin JVM and Android tests under
# `bazel coverage`). The instrumented job uploads test results only, which don't count as a build, so waiting
# for a second upload would hold back the PR comment and status forever.
codecov:
  notify:
    after_n_builds: 1

flags:
  unit:
    after_n_builds: 1

comment:
  layout: "header, diff, flags, components"
  require_changes: false
