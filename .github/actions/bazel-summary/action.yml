name: 'Bazel Summary'
description: 'Writes the BuildBuddy links and action counts of build.log, test.log and coverage.log to the job summary'

inputs:
  title:
    description: 'Heading for this job''s lines'
    required: true
  logs:
    description: 'The directory the logs are in'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Summary
      shell: bash
      run: |
        for step in build test coverage; do
          log="${{ inputs.logs }}/$step.log"
          [ -f "$log" ] || continue
          {
            echo "### ${{ inputs.title }} $step"
            grep -E "Streaming build results to|INFO: [0-9,]+ processes|Executed [0-9]+ out of" "$log" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
        done
