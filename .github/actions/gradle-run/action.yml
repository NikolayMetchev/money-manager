name: 'Gradle Run'
description: 'Sets up JDK, Gradle, and runs a Gradle command'

inputs:
  command:
    description: 'The Gradle command to run (e.g., build, lintFormat)'
    required: true
  cache-read-only:
    description: 'Whether the Gradle cache should be read-only'
    required: false
    default: 'false'
  cache-encryption-key:
    description: 'AES key for configuration-cache data; empty disables config-cache save/restore'
    required: false
    default: ''
  kotlin-native:
    description: 'Whether to restore (and, unless read-only, save) the Kotlin/Native toolchain in ~/.konan'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Gradle environment
      uses: ./.github/actions/gradle-setup
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        kotlin-native: ${{ inputs.kotlin-native }}

    - name: Run Gradle
      shell: bash
      run: ./gradlew ${{ inputs.command }} --no-daemon

    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-reports
        path: |
          **/build/reports/**
        retention-days: 7
