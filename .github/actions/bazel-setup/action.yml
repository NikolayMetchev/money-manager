name: 'Bazel Setup'
description: 'Bazel through bazelisk with its caches, BuildBuddy when the key is set'

inputs:
  buildbuddy-api-key:
    description: 'BuildBuddy API key; empty on a fork''s PR, where the build runs on the restored disk cache alone'
    required: false
    default: ''
  config:
    description: 'The .bazelrc config BuildBuddy is used with: rbe (every action on its executors) or cache'
    required: false
    default: 'rbe'
  cache-name:
    description: 'Names the disk cache entry, one per job that builds something different'
    required: true

runs:
  using: 'composite'
  steps:
    # The JDK, Kotlin/Native and every Maven library are Bazel repositories (hermetic, sha256-pinned), so
    # nothing else needs installing. The JVM version lives in .bazelrc.
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: true
        # Not with a BuildBuddy key: its remote cache holds every result, so restoring the disk cache
        # (several GB) only costs time, on the macOS and Windows runners too. A fork's PR (no key) still needs it.
        disk-cache: >-
          ${{ inputs.buildbuddy-api-key != '' && 'false'
          || format('{0}-{1}', github.workflow, inputs.cache-name) }}
        # Nor the repository cache with a key: `--experimental_remote_downloader` (.bazelrc) fetches those from BuildBuddy.
        repository-cache: ${{ inputs.buildbuddy-api-key == '' }}
        # Only main writes the caches, so PR runs don't evict the entries everyone restores.
        cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    - name: Use BuildBuddy
      if: inputs.buildbuddy-api-key != ''
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      run: |
        {
          echo "common --config=${{ inputs.config }}"
          echo "common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
          echo "common --build_metadata=ROLE=CI"
          echo "common --build_metadata=REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        } > user.bazelrc

    # Bazel downloads the Android SDK platform and adb (//bazel/kmp/android) once the license is accepted.
    - name: Accept the Android SDK License
      shell: bash
      run: bazel/ci/accept_android_license.sh
