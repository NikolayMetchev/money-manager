name: 'Gradle Setup'
description: 'Sets up JDK and Gradle for builds'

inputs:
  cache-read-only:
    description: >-
      Whether the Gradle cache should be read-only. Defaults to 'true': only one job per runner OS
      (build.yml's build, native-macos and native-windows) writes Gradle User Home entries, and only
      from main, so the repo's 10 GB Actions cache isn't filled with near-duplicate dependency and
      transform entries that evict the ones every job restores. Read-only jobs restore the latest
      entry saved for their OS.
    required: false
    default: 'true'
  cache-encryption-key:
    description: 'AES key for configuration-cache data; empty disables config-cache save/restore'
    required: false
    default: ''
  kotlin-native:
    description: 'Whether to restore (and, unless read-only, save) the Kotlin/Native toolchain in ~/.konan'
    required: false
    default: 'false'
  kotlin-native-cache-read-only:
    description: >-
      Whether the ~/.konan cache is read-only; empty follows cache-read-only. Lets a job that writes
      no Gradle User Home entry still save its own toolchain (the linuxArm64 link needs a sysroot
      the build job never downloads).
    required: false
    default: ''
  android-emulator:
    description: 'Whether to grant KVM access for a hardware-accelerated Android emulator (Linux only)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Enable KVM for Android emulator hardware acceleration
      if: inputs.android-emulator == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        # JVM version sync: keep this aligned with gradle/libs.versions.toml and CLAUDE.md.
        java-version: '25'
        distribution: 'corretto'  # Corretto includes jmod files required by ProGuard (Temurin removed them in JDK 24+ per JEP 493)

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
      with:
        # No gradle-version pin: ./gradlew uses the wrapper's version anyway, so a pin here only
        # downloads a second, unused distribution.
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-encryption-key: ${{ inputs.cache-encryption-key }}

    # Kotlin/Native downloads its compiler, LLVM and sysroots (~1 GB) into ~/.konan, outside the Gradle
    # cache setup-gradle manages. Keyed on the Kotlin version, since the toolchain changes with nothing else,
    # plus the job: jobs on one OS download different parts of it (only the arm64 link needs the aarch64
    # sysroot), and an exact-key cache is never updated after the first save.
    - name: Read Kotlin version
      id: kotlin-version
      if: inputs.kotlin-native == 'true'
      shell: bash
      run: echo "version=$(sed -nE 's/^kotlin = "([^"]+)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

    - name: Restore Kotlin/Native toolchain
      if: inputs.kotlin-native == 'true' && (inputs.kotlin-native-cache-read-only || inputs.cache-read-only) == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-version.outputs.version }}-${{ github.job }}
        restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-version.outputs.version }}-

    - name: Cache Kotlin/Native toolchain
      if: inputs.kotlin-native == 'true' && (inputs.kotlin-native-cache-read-only || inputs.cache-read-only) != 'true'
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-version.outputs.version }}-${{ github.job }}
        restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-version.outputs.version }}-
