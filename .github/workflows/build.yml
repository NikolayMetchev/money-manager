# Unified CI on Bazel (#1028): build/test, native tests per host, Android device tests, coverage, the desktop
# installers, Qodana and auto-format. A single `changes` job decides once whether the push/PR touches anything
# other than docs/webpage/markdown; every heavy job below `needs` it and is skipped otherwise. A skipped
# *required* job is treated as a pass by branch protection, so the required checks still report green
# (skipping at the workflow level via `on.paths` would instead leave them pending forever and block the merge).
#
# Linux jobs run their actions on BuildBuddy's executors (`--config=rbe`, #1017); macOS and Windows build on
# their runners and share its remote cache (`--config=cache`). Build results stream to BuildBuddy, linked from
# each job's summary. On a fork's PR there is no key: the build runs on the restored disk cache alone.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      # Default to 'true' (run everything) when the filter doesn't run, e.g. on
      # workflow_dispatch where there is no diff base. A non-empty 'false' from
      # the filter is truthy and wins over the fallback.
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # Needed so paths-filter can diff against the previous commit on push
      # events (on pull_request it uses the API and the checkout is unused).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # 'every' => a file matches `code` only if it is outside ALL of these
          # globs, so `code` is true when any real (non-docs) file changed.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!webpage/**'
              - '!**/*.md'
              - '!.github/workflows/static.yml'
              - '!.github/workflows/dependency-submission.yml'

  # Everything `bazel build //...` and `bazel test //...` cover on Linux: every compile (JVM, Android, linuxX64,
  # linuxArm64, mingwX64 and the commonMain metadata checks), the JVM, Android host and linuxX64 tests, ktlint,
  # detekt, Android lint, the dependency checks Gradle's buildHealth ran (strict and unused deps), the module
  # checks and the lockfile tests. Auto-format PR keeps the BUILD files in step with the sources.
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: changes
    # Runs on PRs, manual runs and pushes to main (not on releases/* pushes). Heavy jobs run in parallel with
    # lint-format rather than after it: when it pushes formatting fixes, the new run's
    # `concurrency` group cancels this one, so waiting for it would only delay every PR.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # The default desktop Google OAuth client, read by the @google_oauth repository. Empty on forks/PRs without the
    # secrets: the build still compiles and Google Drive reports "not configured".
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      # On every command, so they share one analysis cache; they only change ProGuard and the installer. Shrink
      # only: the keep rules and ServiceLoader providers don't depend on ProGuard's optimizer, which takes most of
      # its time (release builds optimize). The installer bundles the native mm, as release.yml's does.
      BAZEL_FLAGS: --define=proguard_optimize=false --define=bundle_native_cli=true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: linux

      # jpackage's deb needs fakeroot; the installer smoke test's display is Xvfb.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      # Also the linuxArm64 and mingwX64 test binaries (`:<name>_<target>_cross`, manual so local builds skip
      # them) and the launcher that turns their output into JUnit XML, for Native Tests to run on their own
      # runners, and the Linux desktop installer.
      - name: Build
        run: >-
          bazel build $BAZEL_FLAGS //... //app/main/jvm:installer //bazel/kmp/testing:native_launcher_deploy.jar
          $(bazel query 'attr(name, "_(linuxArm64|mingwX64)_cross$", //...)') 2>&1 | tee build.log

      # Every test but the Kotlin JVM and Android ones, which Coverage runs, plus the desktop ProGuard check:
      # `//...` never runs ProGuard (its targets are manual), so a new dependency that needs keep/dontwarn rules
      # would otherwise surface only when release.yml ran. It shrinks the desktop app and checks every
      # ServiceLoader provider survived.
      - name: Test
        run: >-
          bazel test $BAZEL_FLAGS -- //... //app/main/jvm:release_service_providers_test
          $(bazel query 'attr(name, "^test_(jvm|android)$", tests(//...))' | sed 's/^/-/') 2>&1 | tee test.log

      # Kover's replacement (#1026): the Kotlin JVM and Android tests under `bazel coverage`, with .bazelrc's JaCoCo
      # filter, merged into one LCOV report. It credits code to every test that runs it, so it reads higher than
      # Kover's per-module reports did. A command of its own, as coverage instruments what it builds (the
      # installer and ProGuard must see the real jars), and the Go tests can't link under it.
      - name: Coverage
        if: ${{ !cancelled() }}
        run: >-
          bazel coverage $BAZEL_FLAGS $(bazel query 'attr(name, "^test_(jvm|android)$", tests(//...))')
          2>&1 | tee coverage.log

      - name: Coverage summary
        run: |
          cp bazel-out/_coverage/_coverage_report.dat coverage.lcov
          awk -F: '/^SF:/{f++} /^LF:/{lf+=$2} /^LH:/{lh+=$2}
            END{printf "### Coverage\n%d files, %d of %d lines (%.1f%%)\n", f, lh, lf, 100*lh/lf}' \
            coverage.lcov >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: false

      - name: Install and start the desktop installer
        run: bazel/kmp/jpackage/install_smoke_test.sh bazel-bin/app/main/jvm/installer "$(cat VERSION)"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-Linux
          path: bazel-bin/app/main/jvm/installer/*
          retention-days: 7

      - name: Collect native test binaries
        run: |
          for target in linuxArm64 mingwX64; do
            for binary in $(bazel cquery $BAZEL_FLAGS --output=files "attr(name, \"_${target}_cross\$\", //...)"); do
              dir="native-tests/$target/$(dirname "${binary#bazel-out/*/bin/}")"
              mkdir -p "$dir" && cp "$binary" "$dir/"
            done
            cp bazel-bin/bazel/kmp/testing/native_launcher_deploy.jar "native-tests/$target/"
          done
          find native-tests -type f | sort

      - name: Upload linuxArm64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: linuxArm64-test-binaries
          path: native-tests/linuxArm64
          if-no-files-found: error
          retention-days: 1

      - name: Upload mingwX64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: mingwX64-test-binaries
          path: native-tests/mingwX64
          if-no-files-found: error
          retention-days: 1

      - name: Build results
        if: always()
        uses: ./.github/actions/bazel-summary
        with:
          title: Linux

      # Codecov's `files` takes paths, not globs, so list the reports (bazel-testlogs is a symlink).
      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() }}
        run: echo "files=$(find -L bazel-testlogs/ -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

  # Kotlin/Native: each target's common tests run natively on a host of that platform. linuxX64's run in the
  # Build and Test job, which also cross-links linuxArm64's (there is no Kotlin/Native compiler for Linux arm64
  # hosts) and mingwX64's (a Windows runner builds far slower than BuildBuddy); these jobs only run them.
  native-cross:
    name: Native Tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxArm64
            os: ubuntu-26.04-arm
          - target: mingwX64
            os: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      # Some tests read files from the tree at run time, from the workspace root (the runfiles' working directory).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}-test-binaries
          path: ${{ runner.temp }}/native-tests

      # For the launcher, which Bazel compiles for Java 25.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Through Bazel's own launcher (`//bazel/kmp/testing:native_launcher`), so each binary writes the JUnit XML a
      # `bazel test` run would. Java on Windows needs Windows paths.
      - name: Run test binaries
        run: |
          native_path() { if command -v cygpath > /dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
          tests="$RUNNER_TEMP/native-tests"
          launcher="$(native_path "$tests/native_launcher_deploy.jar")"
          status=0
          while IFS= read -r -d '' binary; do
            rel="${binary#"$tests"/}"
            echo "::group::$rel"
            chmod +x "$binary"
            mkdir -p "native-test-results/$(dirname "$rel")"
            XML_OUTPUT_FILE="$(native_path "$PWD/native-test-results/$(dirname "$rel")/test.xml")" \
              java -jar "$launcher" "$(native_path "$binary")" || status=1
            echo "::endgroup::"
          done < <(find "$tests" -type f \( -name '*.kexe' -o -name '*.exe' \) -print0)
          exit $status

      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() }}
        run: echo "files=$(find native-test-results -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: native
          name: native-${{ matrix.target }}-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

  # macOS: every compile a Mac builds (macosArm64 only builds there: it needs Xcode), its `mm`, and its native
  # tests. The JVM tests ran on Linux.
  native-macos:
    name: Native Tests (macosArm64)
    runs-on: macos-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: cache
          cache-name: macos

      - name: Build
        run: bazel build //... 2>&1 | tee build.log

      - name: Test
        run: bazel test $(bazel query 'attr(name, "_macosArm64$", tests(//...))') 2>&1 | tee test.log

      - name: Build results
        if: always()
        uses: ./.github/actions/bazel-summary
        with:
          title: macOS

      # Codecov's `files` takes paths, not globs, so list the reports (bazel-testlogs is a symlink).
      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() }}
        run: echo "files=$(find -L bazel-testlogs/ -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: native
          name: native-macosArm64-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

  # The device tests (#1024): kmp_test's `:<name>_device` targets and the release smoke test, run through adb on
  # an emulator. They're `manual`, so `bazel test //...` leaves them out; this job runs everything tagged
  # android_device. The APKs build on BuildBuddy, the tests run here (`local`), one at a time (`exclusive`).
  android-test:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Enable KVM for Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: android-device

      # Building first keeps the emulator's time limit for the tests.
      - name: Build the test APKs
        run: bazel build $(bazel query 'attr(tags, android_device, tests(//...))')

      # Restore on every ref, save only from main (below): a ~2 GB snapshot saved from a PR's merge
      # ref can't be restored by main or any other PR, and only pushes the shared entries out.
      - name: Restore AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Android emulator API level sync: update with android-release-smoke-test.yml,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          key: avd-pixel6-api36-aosp-atd-${{ runner.os }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android emulator API level sync: update with android-release-smoke-test.yml,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          # aosp_atd is the headless test-optimized image.
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          # The API-36 ATD images are only published on the dev sdkmanager channel.
          channel: dev
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Run the device tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android emulator API level sync: update with android-release-smoke-test.yml,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          channel: dev
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bazel test $(bazel query 'attr(tags, android_device, tests(//...))') --test_output=errors

      # Codecov's `files` takes paths, not globs, so list the reports (bazel-testlogs is a symlink).
      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() }}
        run: echo "files=$(find -L bazel-testlogs/ -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: instrumented
          name: instrumented-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 7

  # jpackage packages only for its host, so each OS builds its own installer (#1020): a dmg or msi here (Build and
  # Test builds the deb) with the native mm bundled, as release.yml builds them. Then it installs it and starts the
  # app, mm-jvm and mm. ProGuard's optimizer is off, as in Build and Test's ProGuard check.
  desktop-installer:
    name: Desktop Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            config: cache
          - name: Windows
            os: windows-latest
            config: cache
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ matrix.config }}
          cache-name: installer-${{ matrix.name }}
          android-sdk: 'false'

      - name: Build the installer
        run: >-
          bazel build --define=proguard_optimize=false --define=bundle_native_cli=true
          //app/main/jvm:installer 2>&1 | tee build.log

      - name: Install and start it
        run: bazel/kmp/jpackage/install_smoke_test.sh bazel-bin/app/main/jvm/installer "$(cat VERSION)"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: bazel-bin/app/main/jvm/installer/*
          retention-days: 7

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: changes
    # The R8/minified release APK is manual (`bazel build //...` leaves it out), so build it on every push to
    # main: R8 breakage surfaces there, and release.yml's check-build gate then blocks tagging a broken commit.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: android-release

      - name: Build release APK
        run: bazel build --stamp //app/main/android:release

  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    # Unlike the other heavy jobs this one also runs on workflow_dispatch, so it has no
    # event-name condition.
    # Runs the community 2026.2 linter (qodana.yaml). QODANA_TOKEN is a Qodana Cloud
    # community-tier project token, so results upload to Qodana Cloud; the SARIF also goes to
    # GitHub Code Scanning and the run artifact.
    # The IDE inside Qodana builds its project model from a Bazel sync (qodana.yaml installs the JetBrains Bazel
    # plugin and bazelisk). The sync runs Bazel in the container on the runner's Android SDK, its actions on BuildBuddy (RBE).
    if: >-
      needs.changes.outputs.code == 'true'
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On PRs check out the actual PR commit, not the merge commit; on
          # push/workflow_dispatch fall back to the triggered ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # a full history is required for pull request analysis
          persist-credentials: false  # read-only job, no git push
      # Only for the Android SDK platform and user.bazelrc's BuildBuddy settings: Bazel itself runs in the
      # container. RBE, not just the cache, so the sync hits the actions Build and Test already ran remotely
      # (a local action's cache key differs from the same action run on BuildBuddy's executors).
      - uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: rbe
          cache-name: qodana
      # The job restores and saves the Qodana cache itself (use-caches: false on the action) so it can
      # drop the IDE's cached project model first. A scan that finds a model skips the import, but the
      # model points at files only the import writes (under Gradle, the container's /root/.konan and the
      # project's .kotlin/metadata klibs; under Bazel, the container's output base). With those gone every
      # module is unresolved and the scan reports thousands of false findings. Indexes stay cached.
      - name: Restore Qodana cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: qodana-2026.2-${{ github.sha }}
          restore-keys: |
            qodana-2026.2-main-
            native-false-qodana-2026.2-refs/heads/main-
      - name: Drop the cached IDE project model
        env:
          CACHES: ${{ runner.temp }}/qodana/caches
        run: |
          if [ ! -d "$CACHES" ]; then echo "No Qodana cache restored"; exit 0; fi
          echo "Cache layout:"
          find "$CACHES" -mindepth 1 -maxdepth 3 -type d -not -path '*/caches/*/caches/*' | sort | head -80
          find "$CACHES" -maxdepth 5 -type d \( -name external_build_system -o -name projects \) \
            -not -path '*gradle*' -not -path '*.m2*' -print -prune -exec rm -rf {} +
          find "$CACHES" -maxdepth 6 -type f -path '*/workspace/*.cache' -not -path '*gradle*' -print -delete
          # Plugins too, so the scan runs only the ones qodana.yaml lists: main's cache still holds the Gradle build's
          # SQLDelight plugin, which can't find the dialect without a Gradle import and rejects valid SQLite.
          rm -rf "$CACHES/plugins"
      # The runner image sets ANDROID_HOME in its environment, which the env context below doesn't see.
      - name: Expose the Android SDK path
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
        with:
          upload-result: true
          # Full scan on PRs too, not pr-mode: changed-files-only let a PR pass while breaking main
          # (e.g. a change in one module making another module's code flaggable). Main carries no
          # accepted findings, so with a fail threshold of 0 a PR fails exactly when main would.
          pr-mode: false
          use-caches: false
          # Sync builds the generated sources (SQLDelight, kotlin_constants) the model needs, and the Bazel plugin opens
          # the checkout as a Bazel project only with auto-open on (the bootstrap moves .idea aside, see
          # .qodana/open-as-bazel.sh). The bootstrap installs packages, so the container runs as root.
          args: --property=bsp.build.project.on.sync=true,--property=idea.is.internal=true,--property=bazel.project.auto.open.if.present=true,--user,root,--volume,${{ env.ANDROID_HOME }}:/opt/android-sdk:ro,--env,ANDROID_HOME=/opt/android-sdk
      - name: Save Qodana cache
        if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/'))
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: qodana-2026.2-main-${{ github.sha }}
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          retention-days: 7
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  lint-format:
    name: Auto-format PR
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # Use PAT to trigger workflows on the pushed commit
          # GITHUB_TOKEN doesn't trigger workflows to prevent infinite loops
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: format
          android-sdk: 'false'

      # Stale BUILD files are regenerated and pushed, not reported. Gazelle failing is a real error (two modules
      # declaring one package, an import nothing provides), so it fails the job.
      - name: Regenerate BUILD files
        run: bazel run //:gazelle

      # Gazelle again, then ktlint -F. What ktlint can't fix still fails the Build and Test job's `_ktlint` tests, so
      # a failure here only means there was something left to fix by hand; the fixes it made are still pushed.
      - name: Run //:format
        run: bazel run //:format || echo "::warning::ktlint left findings it can't fix"

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply //:format auto-fixes (Gazelle, ktlint)

          🤖 Auto-generated by GitHub Actions"
          git push
