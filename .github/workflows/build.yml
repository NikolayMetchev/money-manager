# Unified CI on Bazel (#1028): build/test, native tests per host, Android device tests, coverage, the desktop
# installers and auto-format (Qodana runs in qodana.yml). A single `changes` job decides once whether the push/PR
# touches anything other than docs/webpage/markdown; every heavy job below `needs` it and is skipped otherwise. Branch
# protection requires only `CI Passed` (the last job), which always runs and counts a skipped job as a pass (skipping at
# the workflow level via `on.paths` would instead leave it pending forever and block the merge).
#
# Releases: a push to main that changes code while VERSION has no tag yet (`v<VERSION>`) is also the release's run, as
# the auto-tag workflow used to decide: no list of changed files is consulted, so a release a later push cancelled is
# released by that push's run instead. The release builds run beside the tests, and Release tags the commit `v<VERSION>`
# and publishes them once CI Passed succeeds, so nothing polls for another workflow. A failed release is retried with
# "Re-run failed jobs" on that run.
#
# Linux jobs run their actions on BuildBuddy's executors (`--config=rbe`, #1017); macOS and Windows build on
# their runners and share its remote cache (`--config=cache`). Build results stream to BuildBuddy, linked from
# each job's summary. On a fork's PR there is no key: the build runs on the restored disk cache alone.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # `labeled`/`unlabeled` are for the `native`, `installer`, `android` and `web` labels; any other label's run skips every job.
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

concurrency:
  # A run for another label is a no-op, so it gets its own group instead of cancelling the real run in progress. A later
  # push to main may cancel a release's run: its own run then finds the tag still missing and releases instead.
  group: ${{ github.workflow }}-${{ github.ref }}${{ (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && !contains(fromJSON('["native", "installer", "android", "web"]'), github.event.label.name)) && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      # Default to 'true' (run everything) when the filter doesn't run, e.g. on
      # workflow_dispatch where there is no diff base. A non-empty 'false' from
      # the filter is truthy and wins over the fallback.
      code: ${{ steps.label.outputs.noise != 'true' && (steps.filter.outputs.code || 'true') || 'false' }}
      # Kotlin/Native (the native compiles and tests, the native mm) runs on main, manual runs and a PR labelled
      # `native`; any other PR skips it, in the jobs below and in the Bazel commands they share.
      native: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native') }}
      # The desktop installers (deb, dmg and msi) run on main, manual runs and a PR
      # labelled `installer`; any other PR leaves them out of the jobs and the shared Bazel commands.
      installer: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'installer') }}
      # Android (its compiles, host tests, the app and lint in Build and Test, and the instrumented tests on an emulator)
      # runs on main, manual runs and a PR labelled `android`; any other PR leaves it out of the job and the shared Bazel
      # commands.
      android: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'android') }}
      # The browser targets (wasmJs and js: their compiles, Node tests and the web app) run on main, manual runs and a PR
      # labelled `web`; any other PR leaves them out of the shared Bazel commands.
      web: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'web') }}
      noise: ${{ steps.label.outputs.noise }}
      # The tag to release (`v<VERSION>`) on a push to main that changes code while VERSION is not tagged yet; empty
      # otherwise. The release jobs run only when it is set.
      release: ${{ steps.release.outputs.tag }}
    steps:
      - name: Ignore labels other than native, installer, android and web
        id: label
        env:
          NOISE: ${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && !contains(fromJSON('["native", "installer", "android", "web"]'), github.event.label.name) }}
        run: echo "noise=$NOISE" >> "$GITHUB_OUTPUT"
      # Needed so paths-filter can diff against the previous commit on push
      # events (on pull_request it uses the API and the checkout is unused).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # 'every' => a file matches `code` only if it is outside ALL of these
          # globs, so `code` is true when any real (non-docs) file changed.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!webpage/**'
              - '!**/*.md'
              - '!.github/workflows/static.yml'
              - '!.github/workflows/dependency-submission.yml'
      # Every push to main that changes code checks, not only one that edits VERSION: the push payload's file lists can't
      # be relied on (head_commit.modified missed the bumps to 1.0.14, 1.0.15 and 1.0.16, none of which released). A VERSION that
      # is already tagged releases nothing.
      - name: Is this a release?
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.filter.outputs.code == 'true'
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || rc=$?
          case $rc in
            0) echo "$tag already exists: nothing to release" ;;
            2) echo "Releasing $tag"; echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Couldn't list the tags (git ls-remote exited $rc)"; exit 1 ;;
          esac

  # Everything `bazel build //...` and `bazel test //...` cover on Linux: every compile (JVM, Android, linuxX64,
  # linuxArm64, mingwX64 and the commonMain metadata checks), the JVM, Android host and linuxX64 tests, ktlint,
  # detekt, Android lint, the dependency checks Gradle's buildHealth ran (strict and unused deps), the module
  # checks and the lockfile tests. Auto-format PR keeps the BUILD files in step with the sources.
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: changes
    # Runs on PRs, manual runs and pushes to main (not on releases/* pushes). Heavy jobs run in parallel with
    # lint-format rather than after it: when it pushes formatting fixes, the new run's
    # `concurrency` group cancels this one, so waiting for it would only delay every PR.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # The default desktop Google OAuth client, read by the @google_oauth repository. Empty on forks/PRs without the
    # secrets: the build still compiles and Google Drive reports "not configured".
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      NATIVE: ${{ needs.changes.outputs.native }}
      LINK_MM: ${{ github.event_name == 'pull_request' && needs.changes.outputs.installer != 'true' }}
      ANDROID: ${{ needs.changes.outputs.android }}
      WEB: ${{ needs.changes.outputs.web }}
      BAZEL_FLAGS: --define=native_optimize=false --config=coverage
    # `shell: bash` runs with pipefail; the default shell doesn't, so `bazel … | tee` would take tee's exit code and
    # pass with failing tests.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      # Every Bazel command is bazel/ci/build_and_test.sh: the build and tests, coverage, and collecting what the
      # steps below read into ci-out/. With BuildBuddy it runs on a BuildBuddy runner (Remote Bazel), resumed from a
      # snapshot of an earlier run's machine, Bazel server and all: a fresh runner would spend most of a cached build
      # restoring caches and analysing. A PR's first run resumes main's snapshot, later ones its own. A fork's PR
      # (no key) runs it here, on the restored disk cache.
      - name: Where Bazel runs
        id: where
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: echo "remote=$([ -n "$BUILDBUDDY_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Bazel
        if: steps.where.outputs.remote == 'false'
        uses: ./.github/actions/bazel-setup
        with:
          cache-name: linux

      - name: Install the BuildBuddy CLI
        if: steps.where.outputs.remote == 'true'
        env:
          BB_VERSION: 5.0.512  # renovate: buildbuddy-io/bazel
        run: |
          release="https://github.com/buildbuddy-io/bazel/releases/download/$BB_VERSION/bazel-$BB_VERSION-linux-x86_64"
          mkdir -p "$RUNNER_TEMP/bb"
          curl -fsSL -o "$RUNNER_TEMP/bb/bazel-$BB_VERSION-linux-x86_64" "$release"
          curl -fsSL "$release.sha256" | (cd "$RUNNER_TEMP/bb" && sha256sum -c --quiet)
          mv "$RUNNER_TEMP/bb/bazel-$BB_VERSION-linux-x86_64" "$RUNNER_TEMP/bb/bb" && chmod +x "$RUNNER_TEMP/bb/bb"
          echo "$RUNNER_TEMP/bb" >> "$GITHUB_PATH"

      # The runner runs our RBE image (the one bazel/platforms names), so the build sees the executors' system.
      # Its properties are part of the snapshot key: change one and every branch starts cold. Every run saves a
      # snapshot (by default a branch other than main saves only its first), so a PR's next push resumes this
      # one's Bazel server. The OAuth client goes in as secret env overrides, which BuildBuddy keeps out of its
      # logs and cache.
      - name: Build and Test (BuildBuddy runner)
        if: steps.where.outputs.remote == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GIT_REPO_DEFAULT_BRANCH: main
        run: |
          image=$(sed -n 's/^ *"container-image": "\(.*\)",$/\1/p' bazel/platforms/BUILD.bazel | head -1)
          bb remote --os=linux --arch=amd64 --timeout=60m --container_image="$image" \
            --runner_exec_properties=EstimatedCPU=8 --runner_exec_properties=EstimatedMemory=16GB \
            --runner_exec_properties=EstimatedFreeDiskBytes=40GB \
            --runner_exec_properties=remote-snapshot-save-policy=always \
            --run_from_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --run_from_commit="$GITHUB_SHA" \
            --env=REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --env=LINK_MM="$LINK_MM" --env=NATIVE="$NATIVE" --env=ANDROID="$ANDROID" --env=WEB="$WEB" \
            --remote_run_header="x-buildbuddy-platform.secret-env-overrides=GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --invocation_id_file=remote-run.id \
            --script="bazel/ci/build_and_test.sh $BAZEL_FLAGS"

      - name: Fetch the BuildBuddy runner's outputs
        if: ${{ !cancelled() && steps.where.outputs.remote == 'true' && hashFiles('remote-run.id') != '' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel/ci/fetch_artifacts.sh "$(cat remote-run.id)" ci-out

      - name: Build and Test
        if: steps.where.outputs.remote == 'false'
        env:
          BUILDBUDDY_ARTIFACTS_DIRECTORY: ci-out
        run: bazel/ci/build_and_test.sh $BAZEL_FLAGS

      - name: Coverage summary
        run: |
          # The report's own totals are its last LINE counter.
          files=$(grep -c '<sourcefile ' ci-out/coverage.xml)
          grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"' ci-out/coverage.xml | tail -1 | tr -c '0-9' ' ' |
            awk -v f="$files" '{printf "### Coverage\n%d files, %d of %d lines (%.1f%%)\n", f, $2, $1+$2, 100*$2/($1+$2)}' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit
          files: ci-out/coverage.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Unpack native test binaries
        if: needs.changes.outputs.native == 'true'
        run: tar --zstd -xf ci-out/native-tests.tar.zst && find native-tests -type f | sort

      - name: Upload linuxArm64 test binaries
        if: needs.changes.outputs.native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linuxArm64-test-binaries
          path: native-tests/linuxArm64
          if-no-files-found: error
          retention-days: 1

      - name: Upload mingwX64 test binaries
        if: needs.changes.outputs.native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mingwX64-test-binaries
          path: native-tests/mingwX64
          if-no-files-found: error
          retention-days: 1

      - name: Build results
        if: always()
        uses: ./.github/actions/bazel-summary
        with:
          title: Linux
          logs: ci-out

      # Codecov's `files` takes paths, not globs, so list the reports.
      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() && hashFiles('ci-out/testlogs.tar') != '' }}
        run: |
          mkdir -p ci-out/testlogs && tar -xf ci-out/testlogs.tar -C ci-out/testlogs
          echo "files=$(find ci-out/testlogs -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

  # Kotlin/Native: each target's common tests run natively on a host of that platform. linuxX64's run in the
  # Build and Test job, which also cross-links linuxArm64's (there is no Kotlin/Native compiler for Linux arm64
  # hosts) and mingwX64's (a Windows runner builds far slower than BuildBuddy); these jobs only run them.
  native-cross:
    name: Native Tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [ changes, build ]
    if: needs.changes.outputs.native == 'true' && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxArm64
            os: ubuntu-26.04-arm
          - target: mingwX64
            os: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      # Some tests read files from the tree at run time, from the workspace root (the runfiles' working directory).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}-test-binaries
          path: ${{ runner.temp }}/native-tests

      # Through Bazel's own launcher (`//bazel/kmp/testing/launcher`, a Kotlin/Native program built for this target), so
      # each binary writes the JUnit XML a `bazel test` run would. Windows needs Windows paths.
      - name: Run test binaries
        run: |
          native_path() { if command -v cygpath > /dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
          tests="$RUNNER_TEMP/native-tests"
          launcher="$(find "$tests" -maxdepth 1 -name 'test-launcher.*')"
          chmod +x "$launcher"
          status=0
          while IFS= read -r -d '' binary; do
            rel="${binary#"$tests"/}"
            echo "::group::$rel"
            chmod +x "$binary"
            mkdir -p "native-test-results/$(dirname "$rel")"
            XML_OUTPUT_FILE="$(native_path "$PWD/native-test-results/$(dirname "$rel")/test.xml")" \
              "$launcher" "$(native_path "$binary")" || status=1
            echo "::endgroup::"
          done < <(find "$tests" -type f \( -name '*.kexe' -o -name '*.exe' \) ! -name 'test-launcher.*' -print0)
          exit $status

      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() }}
        run: echo "files=$(find native-test-results -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: native
          name: native-${{ matrix.target }}-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

  # macOS: the macosArm64 compiles and native tests. Everything else ran on Linux. `rbe-mac`
  # sends its Kotlin/Native klib compiles, macosArm64 included, to BuildBuddy's Linux executors (#1089);
  # everything else (cinterop, C, links, tests) runs on the runner.
  native-macos:
    name: Native Tests (macosArm64)
    runs-on: macos-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.native == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      # A Mac only needs the Command Line Tools (#1319), so build as one that has nothing else.
      - name: Use the Command Line Tools instead of Xcode
        run: sudo xcode-select --switch /Library/Developer/CommandLineTools

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: rbe-mac
          cache-name: macos

      - name: Build
        run: bazel build --config=native --define=native_optimize=false $(bazel query 'attr(name, "_macosArm64", //...) except attr(tags, manual, //...)') 2>&1 | tee build.log

      - name: Test
        run: bazel test --config=native --define=native_optimize=false $(bazel query 'attr(name, "_macosArm64$", tests(//...))') 2>&1 | tee test.log

      - name: Build results
        if: always()
        uses: ./.github/actions/bazel-summary
        with:
          title: macOS

      # Codecov's `files` takes paths, not globs, so list the reports.
      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() && hashFiles('ci-out/testlogs.tar') != '' }}
        run: |
          mkdir -p ci-out/testlogs && tar -xf ci-out/testlogs.tar -C ci-out/testlogs
          echo "files=$(find ci-out/testlogs -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: native
          name: native-macosArm64-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

  # The device tests (#1024): kmp_test's `:<name>_device` targets and the release smoke test, run through adb on
  # an emulator. .bazelrc leaves them out of `bazel test //...`; this job runs them with `--config=device`. The APKs
  # build on BuildBuddy, the tests run here (`local`), one at a time (`exclusive`).
  android-test:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.android == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Enable KVM for Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: android-device

      # Building first keeps the emulator's time limit for the tests.
      - name: Build the test APKs
        run: bazel build --config=device --build_tests_only //...

      # The device tests boot the emulator Bazel downloaded (@android_emulator: an API 36 aosp_atd image) when no device
      # is connected, which is a cold boot per target; with-emulator boots one for all of them.
      - name: Run the device tests
        timeout-minutes: 30
        run: bazel run --config=device //tools/android-device-test:with-emulator -- bazel test --config=device //... --test_output=errors

      # Codecov's `files` takes paths, not globs, so list the reports.
      - name: List test reports
        id: test-reports
        if: ${{ !cancelled() && hashFiles('ci-out/testlogs.tar') != '' }}
        run: |
          mkdir -p ci-out/testlogs && tar -xf ci-out/testlogs.tar -C ci-out/testlogs
          echo "files=$(find ci-out/testlogs -name test.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test-reports.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: instrumented
          name: instrumented-test-results
          report_type: test_results
          files: ${{ steps.test-reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 7

  binaries-linux:
    name: Linux
    needs: changes
    if: &production needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/desktop-binaries.yml
    with: { platform: Linux, os: ubuntu-latest, config: rbe, asset: mm-linux-x64 }
    secrets: &production-secrets
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

  binaries-macos:
    name: macOS
    needs: changes
    if: *production
    uses: ./.github/workflows/desktop-binaries.yml
    with: { platform: macOS, os: macos-latest, config: rbe-mac, asset: mm-macos-arm64 }
    secrets: *production-secrets

  binaries-windows:
    name: Windows
    needs: changes
    if: *production
    uses: ./.github/workflows/desktop-binaries.yml
    with: { platform: Windows, os: windows-latest, config: rbe-windows, asset: mm-windows-x64 }
    secrets: *production-secrets

  binaries-linux-arm64:
    name: Linux arm64
    needs: changes
    if: *production
    uses: ./.github/workflows/desktop-binaries.yml
    with: { platform: Linux arm64, os: ubuntu-latest, config: rbe, asset: mm-linux-arm64 }
    secrets: *production-secrets

  installer-linux:
    name: Desktop Installer (Linux)
    needs: [changes, binaries-linux]
    if: >-
      !cancelled() && needs.changes.outputs.installer == 'true' && needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || needs.binaries-linux.result == 'success')
    runs-on: ubuntu-latest
    env: &installer-env
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    defaults: &desktop-defaults
      run:
        shell: bash
    steps: &installer-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-desktop
        if: github.event_name != 'pull_request'
        with:
          platform: ${{ runner.os }}
      - uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ runner.os == 'Linux' && 'rbe' || runner.os == 'macOS' && 'rbe-mac' || 'rbe-windows' }}
          cache-name: installer-${{ runner.os }}

      - name: Install Linux packaging and smoke-test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fakeroot

      - name: Package and smoke-test the installer
        env:
          PRODUCTION: ${{ github.event_name != 'pull_request' }}
          INSTALLER_AOT: ${{ github.event_name != 'pull_request' }}
          INSTALLER_NATIVE_CLI: ${{ github.event_name != 'pull_request' || (runner.os == 'Linux' && needs.changes.outputs.native == 'true') }}
        run: |
          if [ "$PRODUCTION" = true ]; then
            flags=(--define=prebuilt_desktop=true)
          else
            flags=(--define=r8_optimize=false --define=native_optimize=false --define=aot=false)
            if [ "$INSTALLER_NATIVE_CLI" = true ]; then flags+=(--config=native --define=bundle_native_cli=true); fi
          fi
          bazel build "${flags[@]}" --remote_download_outputs=toplevel //app/main/jvm:installer
          if [ "$PRODUCTION" = false ] && [ "$RUNNER_OS" = Linux ]; then
            bazel test "${flags[@]}" //app/main/jvm:release_service_providers_test
          fi
          bazel/kmp/jpackage/install_smoke_test.sh bazel-bin/app/main/jvm/installer "$(cat VERSION)"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: installer-${{ runner.os }}
          path: bazel-bin/app/main/jvm/installer/*
          if-no-files-found: error
          retention-days: 7

  installer-macos:
    name: Desktop Installer (macOS)
    needs: [changes, binaries-macos]
    if: >-
      !cancelled() && needs.changes.outputs.installer == 'true' && needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || needs.binaries-macos.result == 'success')
    runs-on: macos-latest
    env: *installer-env
    defaults: *desktop-defaults
    steps: *installer-steps

  installer-windows:
    name: Desktop Installer (Windows)
    needs: [changes, binaries-windows]
    if: >-
      !cancelled() && needs.changes.outputs.installer == 'true' && needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || needs.binaries-windows.result == 'success')
    runs-on: windows-latest
    env: *installer-env
    defaults: *desktop-defaults
    steps: *installer-steps

  benchmark-inputs:
    name: Startup benchmark inputs
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: benchmark-inputs
      - name: Build the shared benchmark databases and driver
        run: |
          bazel build --stamp --remote_download_outputs=toplevel \
            //tools/bench-db:bench_db //tools/bench-db:empty_db //tools/repo-scripts:repo-scripts-tool_deploy.jar
          mkdir bench
          cp bazel-bin/tools/bench-db/{bench,empty}.db bazel-bin/tools/repo-scripts/repo-scripts-tool_deploy.jar bench/

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-inputs
          path: bench/
          if-no-files-found: error
          retention-days: 7

  measure-linux:
    name: Time startup (Linux)
    needs: [binaries-linux, benchmark-inputs]
    runs-on: ubuntu-latest
    defaults: *desktop-defaults
    steps: &measure-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-desktop
        with:
          platform: ${{ runner.os }}
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-inputs
          path: bench

      # The desktop app's display.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The timing tool is compiled for MODULE.bazel's JDK, and the app image's runtime has no java.
      - name: Read the JDK version
        id: jdk
        run: echo "version=$(sed -n 's/^JDK = "\([0-9]*\)\..*/\1/p' MODULE.bazel)" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Extract the app image
        run: mkdir image && tar -xf app/main/jvm/ci-inputs/image.tar -C image

      - name: Time startup
        env:
          MM_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: STARTUP_BENCH_LABEL="$ImageOS $ImageVersion" bazel/perf/startup_bench.sh image "app/main/jvm/ci-inputs/mm${MM_SUFFIX}" bench "startup-${{ runner.os }}.jsonl"

      - name: Upload the startup times
        uses: actions/upload-artifact@v7
        with:
          name: startup-${{ runner.os }}
          path: startup-${{ runner.os }}.jsonl
          if-no-files-found: error
          retention-days: 7

  measure-macos:
    name: Time startup (macOS)
    needs: [binaries-macos, benchmark-inputs]
    runs-on: macos-latest
    defaults: *desktop-defaults
    steps: *measure-steps

  measure-windows:
    name: Time startup (Windows)
    needs: [binaries-windows, benchmark-inputs]
    runs-on: windows-latest
    defaults: *desktop-defaults
    steps: *measure-steps

  # Whatever the OSes measured is kept, so one failed job only leaves a gap. A manual run on another branch measures
  # but records nothing: perf-data is main's history.
  record:
    name: Record startup times
    runs-on: ubuntu-latest
    needs: [measure-linux, measure-macos, measure-windows]
    if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    concurrency:
      group: perf-data
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the startup times
        uses: actions/download-artifact@v8
        with:
          pattern: startup-*
          path: startup
          merge-multiple: true

      - name: Record them on perf-data
        run: bazel/perf/record.sh startup

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: changes
    # The R8/minified release APK is manual (`bazel build //...` leaves it out), so build it on every push to
    # main: R8 breakage surfaces there. On a release's run this APK is the one Release publishes.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: android-release

      - name: Build release APK
        run: bazel build --config=android --stamp --remote_download_outputs=toplevel //app/main/android:release

      # Gradle's name for an unsigned release APK, which the release has always carried.
      - name: Name the release APK
        if: needs.changes.outputs.release != ''
        run: mkdir -p dist && cp bazel-bin/app/main/android/release.apk dist/android-release-unsigned.apk

      - name: Upload the release APK
        if: needs.changes.outputs.release != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  # Publishes the release once everything CI checks on this commit passed (CI Passed) and every release build
  # finished. The release creates its tag, `v<VERSION>`, on this commit. A failed or cancelled job it needs skips it, so
  # re-running the failed jobs retries the release. Auto-format PR, which CI Passed needs, is always skipped on a push,
  # and `!cancelled()` still skipped this job for it (1.0.16's run, where every job it needs succeeded): `always()`,
  # as CI Passed uses, with each job it needs checked by name, is what runs it.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ changes, ci-passed, installer-linux, installer-macos, installer-windows, android-release ]
    if: >-
      ${{ always() && needs.changes.outputs.release != '' && needs.changes.result == 'success' &&
      needs.ci-passed.result == 'success' && needs.installer-linux.result == 'success' &&
      needs.installer-macos.result == 'success' && needs.installer-windows.result == 'success' &&
      needs.android-release.result == 'success' }}
    permissions:
      contents: write  # creates the tag and the release
    steps:
      # Another run on main may have released this VERSION since this run's check (two pushes in quick succession).
      - name: Is it still unreleased?
        id: unreleased
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.changes.outputs.release }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG was released by another run: nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the smoke-tested desktop installers
        if: steps.unreleased.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-artifacts
          merge-multiple: true

      - name: Download the standalone CLI binaries and Android APK
        if: steps.unreleased.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: List them
        if: steps.unreleased.outputs.release == 'true'
        run: ls -la release-artifacts

      - name: Create the release
        if: steps.unreleased.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.changes.outputs.release }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.msi
            release-artifacts/*.dmg
            release-artifacts/*.deb
            release-artifacts/*.apk
            release-artifacts/mm-*

  lint-format:
    name: Auto-format PR
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # Use PAT to trigger workflows on the pushed commit
          # GITHUB_TOKEN doesn't trigger workflows to prevent infinite loops
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: format

      # Stale BUILD files are regenerated and pushed, not reported. Gazelle failing is a real error (two modules
      # declaring one package, an import nothing provides), so it fails the job.
      - name: Regenerate BUILD files
        run: bazel run //:gazelle

      # Gazelle again, then ktlint -F. What ktlint can't fix still fails the Build and Test job's `_ktlint` tests, so
      # a failure here only means there was something left to fix by hand; the fixes it made are still pushed.
      - name: Run //:format
        run: bazel run //:format || echo "::warning::ktlint left findings it can't fix"

      # The KDoc links against checked-in package lists (Dokka runs offline); a refreshed one is pushed with the
      # formatting fixes. A site that's down only warns: the lists already checked in still build.
      - name: Refresh the KDoc's package lists
        run: bazel/kmp/dokka/package-lists/update.sh || echo "::warning::couldn't refresh the KDoc's package lists"

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply //:format auto-fixes (Gazelle, ktlint, KDoc package lists)

          🤖 Auto-generated by GitHub Actions"
          git push
          # This commit isn't the PR's head any more: fail it, so CI Passed can't let auto-merge take it before the
          # pushed commit's own run (the PAT push starts one) has checked the formatted code.
          echo "::error::Pushed //:format fixes; CI runs again on the formatted commit"
          exit 1

  # The one check branch protection requires. A required job that's skipped reports nothing it can match: a skipped
  # matrix job reports under its unexpanded name ("Native Tests (${{ matrix.target }})"), and Codecov reports nothing
  # when no coverage was uploaded, so a docs-only PR waited forever on checks that never came. This job always
  # runs, passes when every job it needs succeeded or was skipped, and fails when one failed or was cancelled.
  # Codecov's checks come from its app, not from a job here, so on a PR whose Build and Test uploaded coverage it
  # waits for codecov/patch and codecov/project on the PR's head commit. Auto-format PR is one of its jobs: a PR whose
  # Gazelle fails, or whose formatting it had to fix and push, doesn't pass on that commit. Android Instrumented Tests
  # is one too: a PR without the `android` label skips it, which counts as a pass.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [ changes, build, native-cross, native-macos, lint-format, android-test, binaries-linux, binaries-macos, binaries-windows, binaries-linux-arm64, installer-linux, installer-macos, installer-windows ]
    if: always() && needs.changes.outputs.noise != 'true'
    permissions:
      checks: read
      pull-requests: read
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi

      - name: Codecov passed
        if: github.event_name == 'pull_request' && needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Codecov posts nothing when the PR changes no Kotlin source (an IDE-settings or docs change has no lines
          # to cover), so there is nothing to wait for.
          if ! gh pr diff "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --name-only | grep -qE '\.kts?$'; then
            echo "No Kotlin files changed; Codecov reports nothing for this PR."
            exit 0
          fi
          # Codecov reports a few minutes after the upload; give it 3 minutes.
          for _ in $(seq 1 18); do
            checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/patch" or .name == "codecov/project"))
                    | "\(.name) \(.status) \(.conclusion) \(.output.title)"')
            echo "$checks"
            if [ "$(echo "$checks" | grep -c ' completed ')" -eq 2 ]; then
              if [ "$(echo "$checks" | grep -c ' completed success ')" -eq 2 ]; then
                exit 0
              fi
              echo "::error::Codecov failed: $(echo "$checks" | grep -v ' completed success ')"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Codecov didn't report codecov/patch and codecov/project within 3 minutes"
          exit 1
