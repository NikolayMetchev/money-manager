# Unified CI: build/test, Android instrumented tests, Qodana, and auto-format.
# A single `changes` job decides once whether the push/PR touches anything
# other than docs/webpage/markdown; every heavy job below `needs` it and is
# skipped otherwise. A skipped *required* job is treated as a pass by branch
# protection, so the required checks still report green (skipping at the
# workflow level via `on.paths` would instead leave them pending forever and
# block the merge).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      # Default to 'true' (run everything) when the filter doesn't run, e.g. on
      # workflow_dispatch where there is no diff base. A non-empty 'false' from
      # the filter is truthy and wins over the fallback.
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # Needed so paths-filter can diff against the previous commit on push
      # events (on pull_request it uses the API and the checkout is unused).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # 'every' => a file matches `code` only if it is outside ALL of these
          # globs, so `code` is true when any real (non-docs) file changed.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!webpage/**'
              - '!**/*.md'
              - '!.github/workflows/static.yml'

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: changes
    # Runs on PRs and pushes to main (not on releases/* pushes). Heavy jobs run in parallel with
    # lint-format rather than after it: when it pushes formatting fixes, the new run's
    # `concurrency` group cancels this one, so waiting for it would only delay every PR.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build with Gradle
        uses: ./.github/actions/gradle-run
        # Default desktop Google OAuth client, injected into the JVM build by the
        # generateGoogleOAuthDefaults task. Scoped to this step only. Empty on forks/PRs without the
        # secrets — the build still compiles and Google Drive reports "not configured".
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          # `koverXmlReport` name-matches into every module and produces the per-module
          # unit-coverage XMLs. db:core's tests run here too: the dedicated `db-core-test` job was
          # removed once parallel test forks + minimal test currency seeding cut its ~12 min
          # jvmTest down to ~1-2 min.
          # `build` runs linuxX64Test natively; linkDebugTestLinuxArm64 cross-links the arm64 test
          # binaries, which the native-linux-arm64 job runs on an arm64 runner.
          command: build koverXmlReport linkDebugTestLinuxArm64 --stacktrace
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          kotlin-native: 'true'

      - name: Upload linuxArm64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-test-binaries
          path: '**/build/bin/linuxArm64/debugTest/test.kexe'
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage and test results to Codecov
        uses: ./.github/actions/codecov-upload
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

  # Kotlin/Native: each target's common tests run natively on a host of that platform. Apple targets
  # only link on macOS and mingwX64 only runs on Windows; linuxArm64 is cross-linked by `build`.
  native-linux-arm64:
    name: Native Tests (linuxArm64)
    runs-on: ubuntu-24.04-arm
    needs: build

    steps:
      - name: Download linuxArm64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-test-binaries

      - name: Run test binaries
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' binary; do
            echo "::group::$binary"
            chmod +x "$binary"
            "$binary" || status=1
            echo "::endgroup::"
          done < <(find . -name test.kexe -print0)
          exit $status

  native-macos:
    name: Native Tests (macosArm64)
    runs-on: macos-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Run macosArm64 tests with Gradle
        uses: ./.github/actions/gradle-run
        with:
          command: macosArm64Test --stacktrace
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          kotlin-native: 'true'

  native-windows:
    name: Native Tests (mingwX64)
    runs-on: windows-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Run mingwX64 tests with Gradle
        uses: ./.github/actions/gradle-run
        with:
          command: mingwX64Test --stacktrace
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          kotlin-native: 'true'

  android-test:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Gradle environment
        uses: ./.github/actions/gradle-setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Android emulator API level sync: update with the Gradle managed device,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          key: avd-pixel6-api36-aosp-atd-${{ runner.os }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android emulator API level sync: update with the Gradle managed device,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          # aosp_atd is the headless test-optimized image — same source as the local
          # Gradle managed device (systemImageSource = "aosp-atd").
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          # The API-36 ATD images are only published on the dev sdkmanager channel.
          channel: dev
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android instrumented tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android emulator API level sync: update with the Gradle managed device,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          # The API-36 ATD images are only published on the dev sdkmanager channel.
          channel: dev
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # JaCoCo coverage instrumentation slows every instrumented test, so PRs run the tests
          # uninstrumented; pushes to main collect and upload the instrumented coverage.
          script: ./gradlew connectedAndroidDeviceTest${{ github.ref == 'refs/heads/main' && ' createAndroidDeviceTestCoverageReport -PandroidCoverage=true' || '' }} --stacktrace --console=plain

      - name: Upload coverage and test results to Codecov
        if: always() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/codecov-upload
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: instrumented
          coverage-file: '**/build/reports/coverage/**/*.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7

  build-health:
    name: Dependency Health
    runs-on: ubuntu-latest
    needs: changes
    # DAGP's buildHealth aggregation over every module used to run inside the main build job
    # (root `build` depended on it); as its own job it gates PRs off the critical path.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Run buildHealth with Gradle
        uses: ./.github/actions/gradle-run
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          command: buildHealth --stacktrace
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

  desktop-proguard:
    name: Desktop ProGuard
    runs-on: ubuntu-latest
    needs: changes
    # `build` never runs ProGuard (only the release installers do), so a new dependency that needs
    # keep/dontwarn rules used to surface only when release.yml ran. This shrinks the desktop app
    # and checks every ServiceLoader provider survived, in parallel with the main build.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Run ProGuard with Gradle
        uses: ./.github/actions/gradle-run
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          command: :app:main:jvm:verifyProguardServiceProviders --stacktrace
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

  desktop-windows-installer:
    name: Desktop Windows Installer
    runs-on: windows-latest
    needs: changes
    # Only release.yml ever configured the desktop app on Windows, so Windows-only breakage (like
    # the WiX setup below) surfaced at release time while every Linux job stayed green. Main only:
    # ProGuard alone takes ~17 minutes on a Windows runner, too slow to gate every PR on.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Package MSI with Gradle
        uses: ./.github/actions/gradle-run
        with:
          # Compose configures WiX by registering tasks on the root project, which isolated projects
          # rejects (https://youtrack.jetbrains.com/issue/CMP-8375), so opt out for this build only.
          command: :app:main:jvm:packageReleaseMsi -Dorg.gradle.isolated-projects=false --stacktrace
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: changes
    # The R8/minified release APK is no longer built on PRs (-PbuildRelease gates the variant),
    # so build it on every push to main: R8 breakage surfaces there, and release.yml's
    # check-build gate then blocks tagging a broken commit. Keep the command identical to
    # release.yml's Android matrix entry so they share a configuration-cache entry.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Build release APK with Gradle
        uses: ./.github/actions/gradle-run
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          command: :app:main:android:assembleRelease -PbuildRelease=true --stacktrace
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    # Unlike the other heavy jobs this one also runs on workflow_dispatch, so it has no
    # event-name condition.
    # Runs the community 2026.2 linter (qodana.yaml). QODANA_TOKEN is a Qodana Cloud
    # community-tier project token, so results upload to Qodana Cloud; the SARIF also goes to
    # GitHub Code Scanning and the run artifact.
    if: >-
      needs.changes.outputs.code == 'true'
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On PRs check out the actual PR commit, not the merge commit; on
          # push/workflow_dispatch fall back to the triggered ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # a full history is required for pull request analysis
          persist-credentials: false  # read-only job, no git push
      - name: Generate SQLDelight and Mappie sources
        uses: ./.github/actions/gradle-run
        with:
          command: jvmMainClasses
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Restore Qodana cache (read-only on non-main branches)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/releases/')
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: qodana-2026.2-refs/heads/main
          restore-keys: qodana-2026.2-
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
        with:
          upload-result: true
          # Full scan on PRs too, not pr-mode: changed-files-only let a PR pass while breaking main
          # (e.g. a change in one module making another module's code flaggable). Main carries no
          # accepted findings, so with a fail threshold of 0 a PR fails exactly when main would.
          pr-mode: false
          use-caches: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/') }}
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          retention-days: 7
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  lint-format:
    name: Auto-format PR
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # Use PAT to trigger workflows on the pushed commit
          # GITHUB_TOKEN doesn't trigger workflows to prevent infinite loops
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          # JVM version sync: keep this aligned with gradle/libs.versions.toml,
          # .github/actions/gradle-setup/action.yml, and CLAUDE.md.
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        # No gradle-version pin: ./gradlew uses the wrapper's version, so a pin here only
        # downloads a second, unused distribution.

      - name: Run lintFormat
        run: ./gradlew lintFormat --no-daemon -Dktlint.ignoreFailures=true --continue

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply lintFormat auto-fixes

          🤖 Auto-generated by GitHub Actions"
          git push
