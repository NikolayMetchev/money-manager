# Unified CI on Bazel (#1028): build/test, native tests per host, Android device tests, coverage, the desktop
# installers, Qodana and auto-format. A single `changes` job decides once whether the push/PR touches anything
# other than docs/webpage/markdown; every heavy job below `needs` it and is skipped otherwise. A skipped
# *required* job is treated as a pass by branch protection, so the required checks still report green
# (skipping at the workflow level via `on.paths` would instead leave them pending forever and block the merge).
#
# Linux jobs run their actions on BuildBuddy's executors (`--config=rbe`, #1017); macOS and Windows build on
# their runners and share its remote cache (`--config=cache`). Build results stream to BuildBuddy, linked from
# each job's summary. On a fork's PR there is no key: the build runs on the restored disk cache alone.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      # Default to 'true' (run everything) when the filter doesn't run, e.g. on
      # workflow_dispatch where there is no diff base. A non-empty 'false' from
      # the filter is truthy and wins over the fallback.
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # Needed so paths-filter can diff against the previous commit on push
      # events (on pull_request it uses the API and the checkout is unused).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # 'every' => a file matches `code` only if it is outside ALL of these
          # globs, so `code` is true when any real (non-docs) file changed.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!webpage/**'
              - '!**/*.md'
              - '!.github/workflows/static.yml'
              - '!.github/workflows/dependency-submission.yml'

  # Everything `bazel build //...` and `bazel test //...` cover on Linux: every compile (JVM, Android, linuxX64,
  # linuxArm64, mingwX64 and the commonMain metadata checks), the JVM, Android host and linuxX64 tests, ktlint,
  # detekt, Android lint, the dependency checks Gradle's buildHealth ran (strict and unused deps), the module
  # checks and the lockfile tests. Auto-format PR keeps the BUILD files in step with the sources.
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: changes
    # Runs on PRs, manual runs and pushes to main (not on releases/* pushes). Heavy jobs run in parallel with
    # lint-format rather than after it: when it pushes formatting fixes, the new run's
    # `concurrency` group cancels this one, so waiting for it would only delay every PR.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # The default desktop Google OAuth client, read by the @google_oauth repository. Empty on forks/PRs without the
    # secrets: the build still compiles and Google Drive reports "not configured".
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: linux

      - name: Build
        run: bazel build //... 2>&1 | tee build.log

      - name: Test
        run: bazel test //... 2>&1 | tee test.log

      - name: Build results
        if: always()
        uses: ./.github/actions/bazel-summary
        with:
          title: Linux

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-test-results
          report_type: test_results
          files: bazel-testlogs/**/test.xml
          disable_search: true
          fail_ci_if_error: false

  # Kover's replacement (#1026): `bazel coverage` over the Kotlin tests, with .bazelrc's JaCoCo filter, merged into
  # one LCOV report. It credits code to every test that runs it, so it reads higher than Kover's per-module reports
  # did. The Go tests can't link under coverage, so the Kotlin tests are picked by query.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: coverage

      - name: Coverage
        run: bazel coverage $(bazel query 'attr(name, "^test_(jvm|android)$", tests(//...))')

      - name: Summary
        run: |
          cp bazel-out/_coverage/_coverage_report.dat coverage.lcov
          awk -F: '/^SF:/{f++} /^LF:/{lf+=$2} /^LH:/{lh+=$2}
            END{printf "### Coverage\n%d files, %d of %d lines (%.1f%%)\n", f, lh, lf, 100*lh/lf}' \
            coverage.lcov >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: false

  # Kotlin/Native: each target's common tests run natively on a host of that platform. linuxX64's run in the
  # Build and Test job. There is no Kotlin/Native compiler for Linux arm64 hosts, so linuxArm64's test binaries
  # are cross-linked on x64 and run on an arm64 runner.
  native-linux-arm64-link:
    name: Native Link (linuxArm64)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: linux-arm64
          android-sdk: 'false'

      # A test binary only builds where it runs (RUNS_ON), so the target platform is set to Linux arm64.
      - name: Cross-link linuxArm64 test binaries
        run: |
          bazel build --platforms=//bazel/platforms:linux_arm64 --remote_download_outputs=toplevel \
            $(bazel query 'attr(name, "_linuxArm64_bin$", //...)')
          mkdir -p linux-arm64-tests
          for binary in $(bazel cquery --platforms=//bazel/platforms:linux_arm64 --output=files \
              'attr(name, "_linuxArm64_bin$", //...)'); do
            dir="linux-arm64-tests/$(dirname "${binary#bazel-out/*/bin/}")"
            mkdir -p "$dir" && cp "$binary" "$dir/"
          done
          find linux-arm64-tests -name '*.kexe' | sort

      - name: Upload linuxArm64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-test-binaries
          path: linux-arm64-tests
          if-no-files-found: error
          retention-days: 1

  native-linux-arm64:
    name: Native Tests (linuxArm64)
    runs-on: ubuntu-26.04-arm
    needs: native-linux-arm64-link

    steps:
      # Some tests read files from the tree at run time, from the workspace root (the runfiles' working directory).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Download linuxArm64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-test-binaries
          path: ${{ runner.temp }}/linux-arm64-tests

      - name: Run test binaries
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' binary; do
            echo "::group::$binary"
            chmod +x "$binary"
            "$binary" || status=1
            echo "::endgroup::"
          done < <(find "$RUNNER_TEMP/linux-arm64-tests" -name '*.kexe' -print0)
          exit $status

  # macOS and Windows: every compile their host builds (macosArm64 only builds on a Mac), the host's `mm`, and the
  # host's native tests. The JVM tests ran on Linux.
  native-macos:
    name: Native Tests (macosArm64)
    runs-on: macos-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: cache
          cache-name: macos

      - name: Build
        run: bazel build //... 2>&1 | tee build.log

      - name: Test
        run: bazel test $(bazel query 'attr(name, "_macosArm64$", tests(//...))') 2>&1 | tee test.log

      - name: Build results
        if: always()
        uses: ./.github/actions/bazel-summary
        with:
          title: macOS

  native-windows:
    name: Native Tests (mingwX64)
    runs-on: windows-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: cache
          cache-name: windows

      - name: Build
        run: bazel build //... 2>&1 | tee build.log

      - name: Test
        run: bazel test $(bazel query 'attr(name, "_mingwX64$", tests(//...))') 2>&1 | tee test.log

      - name: Build results
        if: always()
        uses: ./.github/actions/bazel-summary
        with:
          title: Windows

  # The device tests (#1024): kmp_test's `:<name>_device` targets and the release smoke test, run through adb on
  # an emulator. They're `manual`, so `bazel test //...` leaves them out; this job runs everything tagged
  # android_device. The APKs build on BuildBuddy, the tests run here (`local`), one at a time (`exclusive`).
  android-test:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Enable KVM for Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: android-device

      # Building first keeps the emulator's time limit for the tests.
      - name: Build the test APKs
        run: bazel build $(bazel query 'attr(tags, android_device, tests(//...))')

      # Restore on every ref, save only from main (below): a ~2 GB snapshot saved from a PR's merge
      # ref can't be restored by main or any other PR, and only pushes the shared entries out.
      - name: Restore AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Android emulator API level sync: update with android-release-smoke-test.yml,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          key: avd-pixel6-api36-aosp-atd-${{ runner.os }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android emulator API level sync: update with android-release-smoke-test.yml,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          # aosp_atd is the headless test-optimized image.
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          # The API-36 ATD images are only published on the dev sdkmanager channel.
          channel: dev
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Run the device tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android emulator API level sync: update with android-release-smoke-test.yml,
          # .idea/runConfigurations/Android_Tests.xml, and CLAUDE.md.
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          channel: dev
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bazel test $(bazel query 'attr(tags, android_device, tests(//...))') --test_output=errors

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: instrumented
          name: instrumented-test-results
          report_type: test_results
          files: bazel-testlogs/**/test.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 7

  desktop-proguard:
    name: Desktop ProGuard
    runs-on: ubuntu-latest
    needs: changes
    # `bazel build //...` never runs ProGuard (its targets are manual), so a new dependency that needs
    # keep/dontwarn rules would surface only when release.yml ran. This shrinks the desktop app and checks
    # every ServiceLoader provider survived, in parallel with the main build.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: proguard
          android-sdk: 'false'

      # Shrink only: the keep rules and ServiceLoader providers don't depend on the optimizer, which takes most
      # of ProGuard's time. Release builds still optimize.
      - name: Run ProGuard
        run: bazel test --define=proguard_optimize=false //app/main/jvm:release_service_providers_test

  # jpackage packages only for its host, so each OS builds its own installer (#1020): a deb, dmg or msi with the
  # native mm bundled, as release.yml builds them. Then it installs it and starts the app, mm-jvm and mm.
  # ProGuard's optimizer is off, as in the Desktop ProGuard check.
  desktop-installer:
    name: Desktop Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            config: rbe
          - name: macOS
            os: macos-latest
            config: cache
          - name: Windows
            os: windows-latest
            config: cache
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ matrix.config }}
          cache-name: installer-${{ matrix.name }}
          android-sdk: 'false'

      # jpackage's deb needs fakeroot; the smoke test's display is Xvfb.
      - name: Install packaging tools
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      - name: Build the installer
        run: >-
          bazel build --define=proguard_optimize=false --define=bundle_native_cli=true
          //app/main/jvm:installer 2>&1 | tee build.log

      - name: Install and start it
        run: bazel/kmp/jpackage/install_smoke_test.sh bazel-bin/app/main/jvm/installer "$(cat VERSION)"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: bazel-bin/app/main/jvm/installer/*
          retention-days: 7

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: changes
    # The R8/minified release APK is manual (`bazel build //...` leaves it out), so build it on every push to
    # main: R8 breakage surfaces there, and release.yml's check-build gate then blocks tagging a broken commit.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: android-release

      - name: Build release APK
        run: bazel build --stamp //app/main/android:release

  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    # Unlike the other heavy jobs this one also runs on workflow_dispatch, so it has no
    # event-name condition.
    # Runs the community 2026.2 linter (qodana.yaml). QODANA_TOKEN is a Qodana Cloud
    # community-tier project token, so results upload to Qodana Cloud; the SARIF also goes to
    # GitHub Code Scanning and the run artifact.
    # The IDE inside Qodana builds its project model from a Gradle import (it has no Bazel import), so this
    # job is the one that still runs Gradle; deleting Gradle (#1031) decides its future.
    if: >-
      needs.changes.outputs.code == 'true'
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On PRs check out the actual PR commit, not the merge commit; on
          # push/workflow_dispatch fall back to the triggered ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # a full history is required for pull request analysis
          persist-credentials: false  # read-only job, no git push
      - name: Generate SQLDelight and Mappie sources
        uses: ./.github/actions/gradle-run
        with:
          command: jvmMainClasses
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      # The job restores and saves the Qodana cache itself (use-caches: false on the action) so it can
      # drop the IDE's cached project model first. A scan that finds a model skips the Gradle import,
      # but the model points at files only the import writes (the container's /root/.konan, the
      # project's .kotlin/metadata klibs). With those gone every native-target module is unresolved and
      # the scan reports ~4,000 false findings. Whether the IDE re-imported depended on what changed,
      # which is why Qodana went red and green at random. Indexes and the Gradle/Maven homes stay cached.
      - name: Restore Qodana cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: qodana-2026.2-${{ github.sha }}
          restore-keys: |
            qodana-2026.2-main-
            native-false-qodana-2026.2-refs/heads/main-
      - name: Drop the cached IDE project model
        env:
          CACHES: ${{ runner.temp }}/qodana/caches
        run: |
          if [ ! -d "$CACHES" ]; then echo "No Qodana cache restored"; exit 0; fi
          echo "Cache layout:"
          find "$CACHES" -mindepth 1 -maxdepth 3 -type d -not -path '*/caches/*/caches/*' | sort | head -80
          find "$CACHES" -maxdepth 5 -type d \( -name external_build_system -o -name projects \) \
            -not -path '*gradle*' -not -path '*.m2*' -print -prune -exec rm -rf {} +
          find "$CACHES" -maxdepth 6 -type f -path '*/workspace/*.cache' -not -path '*gradle*' -print -delete
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
        with:
          upload-result: true
          # Full scan on PRs too, not pr-mode: changed-files-only let a PR pass while breaking main
          # (e.g. a change in one module making another module's code flaggable). Main carries no
          # accepted findings, so with a fail threshold of 0 a PR fails exactly when main would.
          pr-mode: false
          use-caches: false
      - name: Save Qodana cache
        if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/'))
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: qodana-2026.2-main-${{ github.sha }}
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-sarif
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          retention-days: 7
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  lint-format:
    name: Auto-format PR
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # Use PAT to trigger workflows on the pushed commit
          # GITHUB_TOKEN doesn't trigger workflows to prevent infinite loops
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: format
          android-sdk: 'false'

      # Stale BUILD files are regenerated and pushed, not reported. Gazelle failing is a real error (two modules
      # declaring one package, an import nothing provides), so it fails the job.
      - name: Regenerate BUILD files
        run: bazel run //:gazelle

      # Gazelle again, then ktlint -F. What ktlint can't fix still fails the Build and Test job's `_ktlint` tests, so
      # a failure here only means there was something left to fix by hand; the fixes it made are still pushed.
      - name: Run //:format
        run: bazel run //:format || echo "::warning::ktlint left findings it can't fix"

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply //:format auto-fixes (Gazelle, ktlint)

          🤖 Auto-generated by GitHub Actions"
          git push
