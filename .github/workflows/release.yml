name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allow manual triggering from auto-tag workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Required to create releases and upload assets
  actions: read # Required to check workflow status

jobs:
  check-build:
    name: Verify Build Passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get commit SHA for tag
        id: get-sha
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # For tag pushes, get the commit the tag points to
            COMMIT_SHA="${{ github.sha }}"
          else
            # For workflow_dispatch, get the SHA from the ref
            COMMIT_SHA=$(git rev-parse HEAD)
          fi
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Checking build status for commit: $COMMIT_SHA"

      - name: Check if build workflow passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ steps.get-sha.outputs.sha }}"
          echo "Waiting for build workflow to complete for commit $COMMIT_SHA..."

          # Wait up to 40 minutes: a full build routinely takes ~15, and a release is
          # often dispatched straight after the merge that starts it
          for i in {1..80}; do
            # Get the latest build workflow run for this commit
            BUILD_STATUS=$(gh run list \
              --workflow=build.yml \
              --commit="$COMMIT_SHA" \
              --json conclusion \
              --jq '(.[0].conclusion // "") | if . == "" then "pending" else . end')

            echo "Build status: $BUILD_STATUS"

            if [ "$BUILD_STATUS" = "success" ]; then
              echo "✓ Build workflow passed for commit $COMMIT_SHA"
              exit 0
            elif [ "$BUILD_STATUS" = "failure" ] || [ "$BUILD_STATUS" = "cancelled" ]; then
              echo "✗ Build workflow failed or was cancelled for commit $COMMIT_SHA"
              echo "Release cannot proceed without a successful build"
              exit 1
            fi

            # Still pending, wait and retry
            sleep 30
          done

          echo "✗ Timeout waiting for build workflow to complete"
          exit 1

  # The release is built by Bazel, stamped (`--stamp`: the APK's VCS info). jpackage packages only for its host, so
  # each desktop installer builds on its OS; ProGuard's optimizer is on, as in every release.
  build-all:
    name: Build ${{ matrix.platform }}
    needs: [check-build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            config: cache
            targets: --define=bundle_native_cli=true //app/main/jvm:installer
            artifact-name: windows-installer
            artifact-path: bazel-bin/app/main/jvm/installer/*.msi
          - platform: macOS
            os: macos-latest
            config: cache
            targets: --define=bundle_native_cli=true //app/main/jvm:installer
            artifact-name: macos-installer
            artifact-path: bazel-bin/app/main/jvm/installer/*.dmg
          - platform: Linux
            os: ubuntu-latest
            config: rbe
            targets: --define=bundle_native_cli=true //app/main/jvm:installer
            artifact-name: linux-installer
            artifact-path: bazel-bin/app/main/jvm/installer/*.deb
            # jpackage's deb needs fakeroot.
            packages: fakeroot
          - platform: Android
            os: ubuntu-latest
            config: rbe
            targets: //app/main/android:release
            artifact-name: android-apk
            # Gradle's name for an unsigned release APK, which the release has always carried.
            rename: bazel-bin/app/main/android/release.apk:dist/android-release-unsigned.apk
            artifact-path: dist/*.apk
    defaults:
      run:
        shell: bash
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ matrix.config }}
          cache-name: release-${{ matrix.platform }}
          android-sdk: ${{ matrix.platform == 'Android' }}

      - name: Install packaging tools
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build ${{ matrix.platform }}
        run: bazel build --stamp --remote_download_outputs=toplevel ${{ matrix.targets }}

      - name: Name the artifact
        if: matrix.rename
        run: |
          from="${{ matrix.rename }}"
          mkdir -p "$(dirname "${from#*:}")"
          cp "${from%%:*}" "${from#*:}"

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  # The standalone `mm` command-line client (app/main/cli), one native binary per target, as `mm-<os>-<arch>`
  # (kmp_native_executable's release_assets: a tarball keeping the exec bit on Unix, the .exe on Windows).
  # Linux links linuxX64, linuxArm64 (there is no Kotlin/Native compiler for Linux arm64 hosts) and mingwX64;
  # macosArm64 only links on a Mac.
  build-cli:
    name: Build mm (${{ matrix.platform }})
    needs: [check-build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            config: rbe
            targets: //app/main/cli:mm-linux-x64 //app/main/cli:mm-linux-arm64 //app/main/cli:mm-windows-x64
          - platform: macOS
            os: macos-latest
            config: cache
            targets: //app/main/cli:mm-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ matrix.config }}
          cache-name: release-cli-${{ matrix.platform }}
          android-sdk: 'false'

      - name: Link mm
        run: |
          bazel build --remote_download_outputs=toplevel ${{ matrix.targets }}
          mkdir -p cli-dist
          cp $(bazel cquery --output=files 'set(${{ matrix.targets }})') cli-dist/
          ls -la cli-dist

      - name: Upload mm (${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: cli-dist/*
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-all, build-cli]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Display artifact structure
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/windows-installer/*.msi
            release-artifacts/macos-installer/*.dmg
            release-artifacts/linux-installer/*.deb
            release-artifacts/android-apk/*.apk
            release-artifacts/cli-*/mm-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Notes for production releases:
#
# Android Signing:
# - Add secrets: ANDROID_KEYSTORE (base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# - Sign //app/main/android:release (android_apk, //bazel/kmp/android:apk.bzl) with it
# - Update workflow to decode keystore before building
#
# macOS Code Signing (optional but recommended):
# - Add Apple Developer certificate secrets
# - Configure signing to avoid security warnings for users
