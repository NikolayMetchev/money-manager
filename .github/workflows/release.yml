name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allow manual triggering from auto-tag workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Required to create releases and upload assets
  actions: read # Required to check workflow status

jobs:
  check-build:
    name: Verify Build Passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get commit SHA for tag
        id: get-sha
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # For tag pushes, get the commit the tag points to
            COMMIT_SHA="${{ github.sha }}"
          else
            # For workflow_dispatch, get the SHA from the ref
            COMMIT_SHA=$(git rev-parse HEAD)
          fi
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Checking build status for commit: $COMMIT_SHA"

      - name: Check if build workflow passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ steps.get-sha.outputs.sha }}"
          echo "Waiting for build workflow to complete for commit $COMMIT_SHA..."

          # Wait up to 40 minutes: a full build routinely takes ~15, and a release is
          # often dispatched straight after the merge that starts it
          for i in {1..80}; do
            # Get the latest build workflow run for this commit
            BUILD_STATUS=$(gh run list \
              --workflow=build.yml \
              --commit="$COMMIT_SHA" \
              --json conclusion \
              --jq '(.[0].conclusion // "") | if . == "" then "pending" else . end')

            echo "Build status: $BUILD_STATUS"

            if [ "$BUILD_STATUS" = "success" ]; then
              echo "✓ Build workflow passed for commit $COMMIT_SHA"
              exit 0
            elif [ "$BUILD_STATUS" = "failure" ] || [ "$BUILD_STATUS" = "cancelled" ]; then
              echo "✗ Build workflow failed or was cancelled for commit $COMMIT_SHA"
              echo "Release cannot proceed without a successful build"
              exit 1
            fi

            # Still pending, wait and retry
            sleep 30
          done

          echo "✗ Timeout waiting for build workflow to complete"
          exit 1

  build-all:
    name: Build ${{ matrix.platform }}
    needs: [check-build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            # Compose configures WiX by registering tasks on the root project, which isolated projects
            # rejects (https://youtrack.jetbrains.com/issue/CMP-8375), so opt out for this build only.
            task: :app:main:jvm:packageReleaseMsi -PbundleNativeCli=true -Dorg.gradle.isolated-projects=false
            kotlin-native: 'true'
            artifact-name: windows-installer
            artifact-path: app/main/jvm/build/compose/binaries/main-release/msi/*.msi
          - platform: macOS
            os: macos-latest
            task: :app:main:jvm:packageReleaseDmg -PbundleNativeCli=true
            kotlin-native: 'true'
            artifact-name: macos-installer
            artifact-path: app/main/jvm/build/compose/binaries/main-release/dmg/*.dmg
          - platform: Linux
            os: ubuntu-latest
            task: :app:main:jvm:packageReleaseDeb -PbundleNativeCli=true
            kotlin-native: 'true'
            artifact-name: linux-installer
            artifact-path: app/main/jvm/build/compose/binaries/main-release/deb/*.deb
          - platform: Android
            os: ubuntu-latest
            task: :app:main:android:assembleRelease -PbuildRelease=true
            artifact-name: android-apk
            artifact-path: app/main/android/build/outputs/apk/release/*.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build ${{ matrix.platform }}
        uses: $/.github/actions/gradle-run
        with:
          command: ${{ matrix.task }} --stacktrace
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          # The desktop installers bundle the host's native mm (app/main/cli)
          kotlin-native: ${{ matrix.kotlin-native || 'false' }}

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7

  # The standalone `mm` command-line client (app/main/cli), one native binary per target. linuxArm64 is
  # cross-linked on x64: there is no Kotlin/Native compiler for Linux arm64 hosts.
  build-cli:
    name: Build mm (${{ matrix.platform }})
    needs: [check-build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            task: :app:main:cli:linkReleaseExecutableLinuxX64 :app:main:cli:linkReleaseExecutableLinuxArm64
          - platform: macOS
            os: macos-latest
            task: :app:main:cli:linkReleaseExecutableMacosArm64
          - platform: Windows
            os: windows-latest
            # Selecting a task by name configures every project, and :app:main:jvm's Compose WiX setup
            # breaks isolated projects on Windows (https://youtrack.jetbrains.com/issue/CMP-8375).
            task: :app:main:cli:linkReleaseExecutableMingwX64 -Dorg.gradle.isolated-projects=false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Link mm
        uses: $/.github/actions/gradle-run
        with:
          command: ${{ matrix.task }} --stacktrace
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          kotlin-native: 'true'

      # Artifacts and release assets don't keep the executable bit, so the Unix binaries ship as tarballs
      # (holding a ready-to-run `mm`); the Windows .exe needs no permission and stays a direct asset.
      - name: Package the binaries per target
        shell: bash
        run: |
          mkdir -p cli-dist
          for target in linuxX64:linux-x64 linuxArm64:linux-arm64 macosArm64:macos-arm64 mingwX64:windows-x64; do
            dir="app/main/cli/build/bin/${target%%:*}/releaseExecutable"
            if [ -f "$dir/mm.kexe" ]; then
              staging="$(mktemp -d)"
              cp "$dir/mm.kexe" "$staging/mm"
              chmod +x "$staging/mm"
              tar -czf "cli-dist/mm-${target##*:}.tar.gz" -C "$staging" mm
            fi
            if [ -f "$dir/mm.exe" ]; then cp "$dir/mm.exe" "cli-dist/mm-${target##*:}.exe"; fi
          done
          ls -la cli-dist
          [ -n "$(ls cli-dist)" ]

      - name: Upload mm (${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: cli-dist/*
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-all, build-cli]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Display artifact structure
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/windows-installer/*.msi
            release-artifacts/macos-installer/*.dmg
            release-artifacts/linux-installer/*.deb
            release-artifacts/android-apk/*.apk
            release-artifacts/cli-*/mm-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Notes for production releases:
#
# Android Signing:
# - Add secrets: ANDROID_KEYSTORE (base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# - Configure signing in android-app/build.gradle.kts
# - Update workflow to decode keystore before building
#
# macOS Code Signing (optional but recommended):
# - Add Apple Developer certificate secrets
# - Configure signing to avoid security warnings for users
