# Re-pins a Renovate PR's lockfiles (#1029). Renovate bumps a version in gradle/libs.versions.toml or MODULE.bazel;
# the maven_kmp lockfiles, MODULE.bazel.lock and (after a Kotlin bump) the Kotlin/Native pins then go stale, and the
# lockfile tests fail. Renovate's hosted app can't run post-upgrade commands, so this job runs bazel/renovate/repin.sh
# on the PR's branch and pushes what changed. The push uses the PAT so CI runs again on the re-pinned commit.
name: Renovate pins

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'MODULE.bazel'
      - '.bazelversion'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repin:
    name: Re-pin lockfiles
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: renovate-pins

      - name: Re-pin
        run: bazel/renovate/repin.sh

      - name: Commit and push changes
        run: |
          if git diff --quiet; then echo "Nothing to re-pin"; exit 0; fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Re-pin lockfiles

          🤖 Auto-generated by GitHub Actions (bazel/renovate/repin.sh)"
          git push
