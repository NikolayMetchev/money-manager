name: Dependency Submission

on:
  push:
    branches: [ main ]
    paths:
      - 'bazel/kmp/deps/*.lock.json'
      - 'bazel/maven/*_install.json'
      - 'tools/repo-scripts/**'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Required to submit dependency graph

jobs:
  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: dependency-submission

      # Bazel's resolution is the Maven lockfiles (`bazel run @<hub>//:pin`), so the graph is read from
      # them; nothing needs building. The Kotlin stdlib comes from the Kotlin toolchain, not a lockfile.
      - name: Submit the lockfiles' dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bazel run //tools/repo-scripts:repo-scripts-tool -- dependency-snapshot bazel/kmp/deps/maven_kmp.lock.json bazel/maven/*_install.json \
            | gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" --input -
