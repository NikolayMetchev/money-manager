name: Production desktop binaries

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      os:
        type: string
        required: true
      config:
        type: string
        required: true
      asset:
        type: string
        required: true
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      GOOGLE_OAUTH_CLIENT_ID:
        required: false
      GOOGLE_OAUTH_CLIENT_SECRET:
        required: false

permissions:
  contents: read

env:
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

jobs:
  mm:
    name: Production mm
    # Linux cross-links the Windows and Linux arm64 assets. The Apple binary needs a Mac.
    runs-on: ${{ inputs.platform == 'macOS' && inputs.os || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ inputs.platform == 'macOS' && inputs.config || 'rbe' }}
          cache-name: ${{ inputs.asset }}

      - name: Link mm
        run: |
          bazel build --config=native --remote_download_outputs=toplevel //app/main/cli:${{ inputs.asset }}

      - name: Upload mm (${{ inputs.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: release-mm-${{ inputs.platform }}
          path: bazel-bin/app/main/cli/${{ inputs.asset }}.${{ inputs.platform == 'Windows' && 'exe' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: 7

  jvm:
    name: Production JVM
    if: inputs.platform != 'Linux arm64'
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ inputs.config }}
          cache-name: jvm-${{ inputs.platform }}

      - name: Check the optimized jars
        if: runner.os == 'Linux'
        run: bazel test --stamp //app/main/jvm:release_service_providers_test

      - name: Build and archive the optimized app image
        run: |
          bazel build --stamp --remote_download_outputs=toplevel //app/main/jvm:app_image_aot
          tar -chf image.tar -C bazel-bin/app/main/jvm/app_image_aot .

      - uses: actions/upload-artifact@v7
        with:
          name: jvm-${{ inputs.platform }}
          path: image.tar
          if-no-files-found: error
          retention-days: 7
