# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch, but only when the published
  # content, the database schema (which drives the generated schema docs), or the
  # module structure (which drives the generated module graph) changes
  push:
    branches: ["main"]
    paths:
      - 'webpage/**'
      - 'app/strategies/**'
      - 'tools/strategy-catalog/**'
      - 'app/db/core/src/commonMain/sqldelight/**'
      - '.github/workflows/static.yml'
      - '.github/actions/bazel-setup/**'
      - 'app/**/src/**'
      - 'utils/**/src/**'
      - '**/BUILD.bazel'
      - 'MODULE.bazel'
      - 'bazel/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          cache-name: pages
      - name: Install Graphviz
        # SchemaSpy needs the `dot` binary to render schema relationship diagrams (its action runs here).
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Build the site
        # //webpage:site is webpage/'s pages with the schema docs (database/), the strategy catalog
        # (strategy-library/, which the app fetches from <pages-url>/strategy-library/index.json) and the
        # KDoc (kdoc/) at their paths (#1027).
        run: |
          bazel build --remote_download_outputs=toplevel //webpage:site
          mkdir -p site
          cp -R bazel-bin/webpage/site/. site/
          chmod -R u+w site
      - name: Generate module dependency graph
        # webpage/modules.html reads modules-graph.md: each module's dependencies per compilation, from the
        # build graph.
        run: |
          bazel query '//app/... + //utils/... + //tools/... + //test/...' --output=streamed_jsonproto \
            | python3 bazel/pages/module_graph.py > site/modules-graph.md
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
