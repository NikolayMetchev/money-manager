# Bazel build beside Gradle while the build moves over (#995). Not a required check: Gradle stays the
# source of truth until the cutover.
name: Bazel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'webpage/**', '**/*.md' ]
  pull_request:
    paths-ignore: [ 'docs/**', 'webpage/**', '**/*.md' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel:
    name: Bazel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs every action on BuildBuddy's executors (#1017): JVM, linuxX64, linuxArm64 and mingwX64
          # compile there, and the JVM and linuxX64 tests run there.
          - name: Linux
            os: ubuntu-latest
            config: rbe
          # macOS and Windows build on their own runners, sharing the remote cache: macosArm64 only builds on
          # a Mac, and each runs its own native tests.
          - name: macOS
            os: macos-latest
            config: cache
          - name: Windows
            os: windows-latest
            config: cache
    env:
      # Empty on a fork's PR: the build then runs on the restored disk cache alone.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.name }}
          repository-cache: true
          # Only main writes the caches, so PR runs don't evict the entries everyone restores.
          cache-save: ${{ github.event_name == 'push' }}

      - name: Use BuildBuddy
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          {
            echo "common --config=${{ matrix.config }}"
            echo "common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
            echo "common --build_metadata=ROLE=CI"
            echo "common --build_metadata=REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          } > user.bazelrc

      # Android modules compile against the SDK's android.jar for the catalog's compileSdk (//bazel/kmp/android),
      # which the runners' preinstalled SDK may not have yet. AGP installs it itself; Bazel only looks.
      - name: Install the Android SDK platform
        run: |
          level=$(sed -n 's/^android-compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$sdkmanager" ] || sdkmanager="$sdkmanager.bat"
          (yes || true) | "$sdkmanager" --install "platforms;android-$level.0" > /dev/null

      - name: BUILD files are up to date
        if: matrix.name == 'Linux'
        run: bazel run //:gazelle -- --mode=diff

      - name: Build
        run: bazel build //... 2>&1 | tee build.log

      - name: Test
        run: bazel test //... 2>&1 | tee test.log

      - name: Cache hits
        if: always()
        run: |
          for step in build test; do
            [ -f "$step.log" ] || continue
            {
              echo "### ${{ matrix.name }} $step"
              grep -E "Streaming build results to|INFO: [0-9,]+ processes" "$step.log" | sed 's/^/    /'
            } >> "$GITHUB_STEP_SUMMARY"
          done

  coverage:
    name: Bazel coverage
    runs-on: ubuntu-latest
    # Kover's replacement (#1026): `bazel coverage` over the Kotlin tests, with .bazelrc's JaCoCo filter, merged into
    # one LCOV report. It credits code to every test that runs it, so it reads higher than Kover's per-module
    # reports. The Codecov upload moves here with the workflows (#1028); until then the report is an artifact.
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' }}

      - name: Use BuildBuddy
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          {
            echo "common --config=rbe"
            echo "common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
            echo "common --build_metadata=ROLE=CI"
            echo "common --build_metadata=REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          } > user.bazelrc

      - name: Install the Android SDK platform
        run: |
          level=$(sed -n 's/^android-compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-$level.0" > /dev/null

      - name: Coverage
        run: bazel coverage $(bazel query 'attr(name, "^test_(jvm|android)$", tests(//...))')

      - name: Summary
        run: |
          cp bazel-out/_coverage/_coverage_report.dat coverage.lcov
          awk -F: '/^SF:/{f++} /^LF:/{lf+=$2} /^LH:/{lh+=$2}
            END{printf "### Bazel coverage\n%d files, %d of %d lines (%.1f%%)\n", f, lh, lf, 100*lh/lf}' \
            coverage.lcov >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: bazel-coverage
          path: coverage.lcov
          retention-days: 7

  android-device:
    name: Bazel Android device tests
    runs-on: ubuntu-latest
    # The device tests (#1024): kmp_test's `:test_device` targets and the release smoke test, run through adb on
    # the emulator build.yml's Android Instrumented Tests job uses, from its AVD cache. They're `manual`, so
    # `bazel test //...` leaves them out; this job runs everything tagged android_device. The APKs build on
    # BuildBuddy, the tests run here (`local`), one at a time (`exclusive`).
    timeout-minutes: 45
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM for Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-android-device
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' }}

      - name: Use BuildBuddy
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          {
            echo "common --config=rbe"
            echo "common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
            echo "common --build_metadata=ROLE=CI"
            echo "common --build_metadata=REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          } > user.bazelrc

      - name: Install the Android SDK platform
        run: |
          level=$(sed -n 's/^android-compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-$level.0" > /dev/null

      # Building first keeps the emulator's time limit for the tests.
      - name: Build the test APKs
        run: bazel build $(bazel query 'attr(tags, android_device, tests(//...))')

      # build.yml's Android Instrumented Tests job saves this cache from main.
      - name: Restore AVD cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Android emulator API level sync: update with build.yml's emulator job and CLAUDE.md.
          key: avd-pixel6-api36-aosp-atd-${{ runner.os }}

      - name: Run the device tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android emulator API level sync: update with build.yml's emulator job and CLAUDE.md.
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: aosp_atd
          channel: dev
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bazel test $(bazel query 'attr(tags, android_device, tests(//...))') --test_output=errors

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bazel-android-device-test-results
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 7

  installer:
    name: Bazel installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # jpackage packages only for its host, so each OS builds its own installer (#1020): Compose's
    # packageReleaseDeb/Dmg/Msi with the native mm bundled, as release.yml builds them. Then it installs it
    # and starts the app, mm-jvm and mm. ProGuard's optimizer is off, as in build.yml's Desktop ProGuard check.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            config: rbe
          - name: macOS
            os: macos-latest
            config: cache
          - name: Windows
            os: windows-latest
            config: cache
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-installer-${{ matrix.name }}
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' }}

      - name: Use BuildBuddy
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          {
            echo "common --config=${{ matrix.config }}"
            echo "common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
            echo "common --build_metadata=ROLE=CI"
            echo "common --build_metadata=REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          } > user.bazelrc

      # jpackage's deb needs fakeroot; the smoke test's display is Xvfb.
      - name: Install packaging tools
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      - name: Build the installer
        run: >-
          bazel build --define=proguard_optimize=false --define=bundle_native_cli=true
          //app/main/jvm:installer 2>&1 | tee build.log

      - name: Install and start it
        run: bazel/kmp/jpackage/install_smoke_test.sh bazel-bin/app/main/jvm/installer "$(cat VERSION)"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: bazel-installer-${{ matrix.name }}
          path: bazel-bin/app/main/jvm/installer/*
          retention-days: 7
