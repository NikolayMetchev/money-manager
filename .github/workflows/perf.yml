# Startup performance (#1254): after a push to main, builds the release desktop app and the release native mm on
# Linux, macOS and Windows, times them with `repo-scripts startup-bench` on //tools/bench-db's databases (the desktop
# app and mm-jvm with and without the AOT cache), and appends the results to startup.jsonl on the perf-data branch,
# which webpage/performance.html reads (the Pages site fetches it live, so recording is publishing).
#
# It is its own workflow so it is off the release's critical path: CI (build.yml) builds and smoke-tests the
# installers, and a release never waits for this. Nothing requires it, and a failure only leaves a gap in the graphs.
#
# No installer: it times `//app/main/jvm:app_image_aot`, the app image the installer packages, and `//app/main/cli:mm`,
# both built as a release builds them (ProGuard's optimizer on, mm an optimised link), not with CI's time-saving
# defines. CI's mm is a debug link against the compiler caches (`native_optimize=false`, #1598), which reads the
# benchmark database 13-19x slower on Linux and macOS, so timing CI's build would measure the debug link, not the app.
name: Startup Performance

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # The same files CI (build.yml's `changes`) ignores: a push that changes none of the app has nothing new to time.
    paths-ignore:
      - 'docs/**'
      - 'webpage/**'
      - '**/*.md'
      - '.github/workflows/static.yml'
      - '.github/workflows/dependency-submission.yml'

# One measurement at a time. A push while one runs waits, and a newer push replaces the waiting one, so a burst of
# merges skips commits in between rather than piling up.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Time startup (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            config: rbe
          # `rbe-mac`, as Native Tests (macosArm64) runs: mm's klib compiles go to BuildBuddy.
          - name: macOS
            os: macos-latest
            config: rbe-mac
          - name: Windows
            os: windows-latest
            config: rbe-windows
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job, no git push

      - name: Set up Bazel
        uses: ./.github/actions/bazel-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          config: ${{ matrix.config }}
          cache-name: perf-${{ matrix.name }}

      # The desktop app's display.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The timing tool is compiled for MODULE.bazel's JDK, and the app image's runtime has no java.
      - name: Read the JDK version
        id: jdk
        run: echo "version=$(sed -n 's/^JDK = "\([0-9]*\)\..*/\1/p' MODULE.bazel)" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ steps.jdk.outputs.version }}

      # The release defaults: no `proguard_optimize=false` or `native_optimize=false`.
      - name: Build the release app and mm
        run: |
          targets=(//app/main/jvm:app_image_aot //app/main/cli:mm //tools/bench-db:bench_db //tools/bench-db:empty_db
            //tools/repo-scripts:repo-scripts-tool_deploy.jar)
          bazel build --config=native --remote_download_outputs=toplevel "${targets[@]}" 2>&1 | tee build.log
          files() { bazel cquery --config=native --output=files "$1"; }
          mkdir bench
          cp $(files 'set(//tools/bench-db:bench_db //tools/bench-db:empty_db //tools/repo-scripts:repo-scripts-tool_deploy.jar)') bench/
          echo "IMAGE=$(files //app/main/jvm:app_image_aot)" >> "$GITHUB_ENV"
          echo "MM=$(files //app/main/cli:mm)" >> "$GITHUB_ENV"

      - name: Time startup
        run: STARTUP_BENCH_LABEL="$ImageOS $ImageVersion" bazel/perf/startup_bench.sh "$IMAGE" "$MM" bench "startup-${{ matrix.name }}.jsonl"

      - name: Upload the startup times
        uses: actions/upload-artifact@v7
        with:
          name: startup-${{ matrix.name }}
          path: startup-${{ matrix.name }}.jsonl
          if-no-files-found: error
          retention-days: 7

  # Whatever the OSes measured is kept, so one failed job only leaves a gap. A manual run on another branch measures
  # but records nothing: perf-data is main's history.
  record:
    name: Record startup times
    runs-on: ubuntu-latest
    needs: measure
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    concurrency:
      group: perf-data
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the startup times
        uses: actions/download-artifact@v8
        with:
          pattern: startup-*
          path: startup
          merge-multiple: true

      - name: Record them on perf-data
        run: bazel/perf/record.sh startup
