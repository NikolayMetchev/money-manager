####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

# Every exclusion below works around a verified linter defect (each entry says which); anything the
# linter reported correctly has been fixed in code instead. The two style inspections this project
# rejects on purpose (DestructuringDeclaration, KotlinPrintToLogpoint) are disabled in
# .qodana/profile.xml, not excluded here.
#
# The recurring defects, referenced by number below:
#   [1] Metro DI — @Provides/@ContributesTo/@DependencyGraph members are only reached through the
#       graph Metro generates, so the linter reports the providers, binding containers and graph members
#       as unused. (.idea/misc.xml marks them as entry points, but a Bazel-model scan opens the checkout
#       without .idea — see .qodana/open-as-bazel.sh — so the containers are excluded by path.)
#   [2] Per-module KMP import — the linter resolves each module in isolation, so symbols
#       consumed from another module (expect/actual counterparts, platform impls wired from
#       app/main, test fixtures in test/*, parameters whose non-constant callers live elsewhere)
#       are reported unused/constant.
#   [3] EAP KotlinUnreachableCode — everything after `?: throw`/`?: error(...)` inside a lambda or
#       `use {}` block is flagged unreachable, once per column; the flagged code demonstrably runs
#       (the files execute in production/CI).
#   [5] The Bazel project model has no Kotlin Multiplatform: each module's `_jvm` target holds its
#       commonMain, jvmAndroidMain and jvmMain sources as one JVM module, and the native-only modules
#       (the CLI) are in no module at all. So expect/actual pairs aren't linked (jvm/android actuals look
#       unused), common-only extensions don't resolve (`Dispatchers.IO`'s common import, LazyListScope's
#       `items`/`item`, so their imports and receivers look unused), what only the CLI consumes looks
#       unused, and SQLDelight's generated Kotlin reaches the model as compiled classes (platform types,
#       unresolved KDoc links, receivers whose columns resolve to nothing). Every entry was checked against
#       its users; the build compiles every target with -Werror.
#   [4] Interface-mandated members — override parameters of test fakes and intentional constant
#       returns/no-op bodies of capability methods are design, not defects; the linter has no way
#       to know (and for override params even contradicts its own Java-side exemption).

version: "1.0"
# A Docker image goes in `image:`; `linter:` takes a linter name, and the CLI only warns when it gets an image.
image: jetbrains/qodana-jvm-community:2026.2
plugins:
  # The IDE's project model comes from a Bazel sync (the JetBrains Bazel plugin, as JetBrains' own Qodana run of
  # that plugin's repository does): each module's `_jvm` target is a module holding its commonMain, jvmAndroidMain
  # and jvmMain sources, so native-only source sets belong to no module and aren't analysed.
  - id: org.jetbrains.bazel
# The sync runs Bazel inside the container (the Qodana job mounts the runner's Android SDK and passes the BuildBuddy
# RBE settings in user.bazelrc). Bazel downloads the JDK, Kotlin and every library itself; it needs only bazelisk and a C
# compiler for the host toolchain's autodetection.
bootstrap: >-
  apt-get update -qq &&
  apt-get install -y -qq --no-install-recommends ca-certificates curl gcc g++ python3 > /dev/null &&
  mkdir -p /usr/local/bin &&
  curl -fsSL -o /usr/local/bin/bazel
  https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64 &&
  chmod +x /usr/local/bin/bazel &&
  sh .qodana/open-as-bazel.sh
profile:
  path: .qodana/profile.xml
exclude:
  # Compose @Composable functions are PascalCase by convention; the community linter has no
  # Compose awareness. ktlint (compose ruleset) polices naming in these modules instead.
  - name: FunctionName
    paths:
      - app/ui
      - app/main/android/src
      # Mosaic composables (the terminal progress widgets, the TUI) follow the same convention.
      - app/terminal/src/commonMain/kotlin/com/moneymanager/terminal/TaskProgressView.kt
      - app/tui/src/commonMain
      - app/presenter/core/src/commonMain

  # [3] — `?: error(...)` inside runMoneyManagerComposeUiTest/use{} lambdas.
  - name: KotlinUnreachableCode
    paths:
      - app/ui/core/src/commonTest/kotlin/com/moneymanager/ui/screens/CsvAccountSourceAuditE2ETest.kt
      - app/ui/core/src/commonTest/kotlin/com/moneymanager/ui/screens/MonzoImportAuditE2ETest.kt
      - app/ui/core/src/commonTest/kotlin/com/moneymanager/ui/screens/CsvReimportE2ETest.kt
      - app/importfilesource/localfolder/src/androidMain/kotlin/com/moneymanager/importfilesource/localfolder/SafFolderImportFileSource.kt
      - app/apiimporter/src/commonMain/kotlin/com/moneymanager/apiimporter/ApiSessionImportService.kt
      # The version check after `json.decodeFromString` (in a try whose catch throws) runs — the vault's
      # "newer version is refused" test exercises it; the linter resolves the reified call to Nothing.
      - utils/credentialvault/src/commonMain/kotlin/com/moneymanager/credentialvault/CredentialVaultImpl.kt

  # Compile-verified: these opt-ins are still required (ExperimentalMaterial3Api on
  # ExposedDropdownMenuBox/menuAnchor, ExperimentalTestApi on runComposeUiTest) — removing them
  # breaks the build. EAP false positive.
  - name: UnnecessaryOptInAnnotation
    paths:
      - app/ui

  # [2] — the project compiles (so every expect has its actuals); the linter's KMP model doesn't
  # see the platform source sets that hold them.
  - name: KotlinNoActualForExpect

  # "URI is not registered" on androidDeviceTest AndroidManifest.xml files — the community linter
  # ships no Android plugin, so the manifest schema is unknown to it.
  - name: XmlHighlighting

  # ktlint_* keys are ktlint extension properties (honoured by ktlint, which is what consumes this
  # file); the IDE editorconfig inspection only knows IDE/editorconfig-core keys.
  - name: EditorConfigKeyCorrectness
    paths:
      - app/ui/.editorconfig
      - app/terminal/.editorconfig
      - app/tui/.editorconfig
      - app/presenter/.editorconfig

  # `import kotlinx.serialization.modules.subclassesOfSealed` is used on the next screenful; the
  # linter fails to resolve this experimental serialization API and calls the import unused.
  - name: KotlinUnusedImport
    paths:
      - app/ui/foundation/src/commonMain/kotlin/com/moneymanager/ui/navigation/ScreenSerialization.kt
      # [5] — `import kotlinx.coroutines.IO` (common Dispatchers.IO), used by withContext(Dispatchers.IO).
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/ImportDirectoryDiscovery.kt
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/ImportDirectoryScanner.kt
      - app/importdirectory/src/commonMain/kotlin/com/moneymanager/importdirectory/ImportDirectoryService.kt
      - app/importfilesource/localfolder/src/commonMain/kotlin/com/moneymanager/importfilesource/localfolder/LocalFolderImportFileSource.kt
      - app/remotestorage/googledrive/src/commonMain/kotlin/com/moneymanager/remotestorage/googledrive/DriveImportFileSource.kt
      - app/remotestorage/googledrive/src/commonMain/kotlin/com/moneymanager/remotestorage/googledrive/GoogleDriveProvider.kt
      - app/remotestorage/googledrive/src/commonMain/kotlin/com/moneymanager/remotestorage/googledrive/LoopbackGoogleAccessTokenSource.kt
      - app/remotestorage/googledrive/src/commonMain/kotlin/com/moneymanager/remotestorage/googledrive/LoopbackRedirectReceiver.kt
      - app/strategycatalog/src/commonMain/kotlin/com/moneymanager/strategycatalog/LocalDirectoryStrategyCatalogSource.kt
      # [5] — `import androidx.compose.foundation.lazy.items`, used by the LazyColumn's items(...) calls.
      - app/ui/accounts/src/commonMain/kotlin/com/moneymanager/ui/screens/accounts/AccountsScreen.kt
      - app/ui/audit/src/commonMain/kotlin/com/moneymanager/ui/audit/AuditScreen.kt
      - app/ui/core/src/commonMain/kotlin/com/moneymanager/ui/screens/PassThroughAccountsScreen.kt
      - app/ui/currencies/src/commonMain/kotlin/com/moneymanager/ui/screens/currencies/AssetListTab.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/ApiConnectionsScreen.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/ApiSessionsScreen.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/ApiStrategiesScreen.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/editor/ApiEditorComponents.kt
      - app/ui/imports/csv/src/commonMain/kotlin/com/moneymanager/ui/screens/accountmapping/AccountMappingsScreen.kt
      - app/ui/imports/csv/src/commonMain/kotlin/com/moneymanager/ui/screens/csv/CsvImportsScreen.kt
      - app/ui/imports/csv/src/commonMain/kotlin/com/moneymanager/ui/screens/csvstrategy/CsvStrategiesScreen.kt
      - app/ui/imports/csv/src/commonMain/kotlin/com/moneymanager/ui/screens/csvstrategy/StrategyDialogs.kt
      - app/ui/imports/importDirectory/src/commonMain/kotlin/com/moneymanager/ui/screens/importdirectory/DriveFolderPickerDialog.kt
      - app/ui/imports/qif/src/commonMain/kotlin/com/moneymanager/ui/components/qif/QifRecordList.kt
      - app/ui/imports/qif/src/commonMain/kotlin/com/moneymanager/ui/screens/qif/QifImportsScreen.kt
      - app/ui/imports/reconciliation/src/commonMain/kotlin/com/moneymanager/ui/screens/reconciliation/CardLast4Screen.kt
      - app/ui/imports/reconciliation/src/commonMain/kotlin/com/moneymanager/ui/screens/reconciliation/ReconciliationScreen.kt
      - app/ui/people/src/commonMain/kotlin/com/moneymanager/ui/screens/people/PeopleScreen.kt
      - app/ui/settings/src/commonMain/kotlin/com/moneymanager/ui/screens/settings/StrategyCatalogScreen.kt
      - app/ui/transactions/src/commonMain/kotlin/com/moneymanager/ui/screens/transactions/ManualEntriesScreen.kt

  # Mokkery `calls { (code) -> ... it.code == code }` — the lambda parameter comes from the mock
  # invocation at runtime; the condition is not constant.
  - name: KotlinConstantConditions
    paths:
      - app/ui/transactions/src/commonTest/kotlin/com/moneymanager/ui/screens/transactions/AccountTransactionsScreenTest.kt

  # `assertEquals(emptyList(), decodeRowRules(...))` already has the expected value first.
  - name: KotlinMisorderedAssertEqualsArguments
    paths:
      - app/db/read/src/commonTest/kotlin/com/moneymanager/database/json/FieldMappingJsonCodecTest.kt

  # [2] — each receiver IS used (lastModifiedEpochMs / records / sections / isNull+getLong); the
  # receiver's type lives in another module, so its members resolve to nothing here.
  - name: UnusedReceiverParameter
    paths:
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/ImportDirectoryScanner.kt
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/QifStagingConversion.kt
      - app/importfilesource/localfolder/src/androidMain/kotlin/com/moneymanager/importfilesource/localfolder/SafFolderImportFileSource.kt
      # [5] — the receivers are SQLDelight row/query types whose columns and queries the bodies read.
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/AccountBalanceMapper.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/EntitySourceMapper.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/TradeAuditEntryMapper.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/TransferAuditEntryMapper.kt
      - app/db/repository/src/commonMain/kotlin/com/moneymanager/database/repository/ApiSessionReadRepositoryImpl.kt
      - app/db/repository/src/commonMain/kotlin/com/moneymanager/database/repository/QifImportReadRepositoryImpl.kt
      - app/db/write/src/commonMain/kotlin/com/moneymanager/database/write/CsvImportStrategyInsert.kt
      # [5] — legGroups calls LazyListScope.item; showConnections calls ComposeUiTest.setContent.
      - app/ui/imports/reconciliation/src/commonMain/kotlin/com/moneymanager/ui/screens/reconciliation/ReconciliationScreen.kt
      - app/ui/core/src/commonTest/kotlin/com/moneymanager/ui/credentials/ApiConnectionsVaultE2ETest.kt

  # KonanLauncher loads the Kotlin/Native compiler reflectively: the KotlinMetadataCompiler it passes IS a
  # CLICompiler, but only at run time, so the linter sees an Object.
  - name: JavaReflectionInvocation
    paths:
      - bazel/kmp/native/launcher/src/com/moneymanager/bazel/kmp/nativelauncher/KonanLauncher.java

  # Java 25 launches a non-public main, but `bazel coverage` starts the test runner through JaCoCo's
  # JacocoCoverageRunner, which finds main with Class.getMethod: public methods only.
  - name: UnnecessaryModifier
    paths:
      - bazel/kmp/testing/src/com/moneymanager/bazel/kmp/testing/KmpJUnitRunner.java

  # [5] — the wrapper's query properties are typed by SQLDelight's generated Kotlin (not platform types),
  # and its KDoc links that generated MoneyManagerDatabase.
  - name: HasPlatformType
    paths:
      - app/db/write/src/commonMain/kotlin/com/moneymanager/database/write/MoneyManagerDatabaseWrapper.kt
  - name: KDocUnresolvedReference
    paths:
      - app/db/write/src/commonMain/kotlin/com/moneymanager/database/write/MoneyManagerDatabaseWrapper.kt

  # The Starlark plugin reports rules and module extensions other files load (`aar_import = rule(...)`)
  # and locals that are reassigned and then read (`line = line.strip()`, `quoted = not quoted`) as
  # "never used". Bazel evaluates every one of these files on each build.
  - name: Annotator
    paths:
      - bazel/kmp/android/aar.bzl
      - bazel/kmp/android/extensions.bzl
      - bazel/kmp/checks/checks.bzl
      - bazel/kmp/constants/google_oauth.bzl
      - bazel/kmp/deps/catalog.bzl
      - bazel/kmp/deps/extensions.bzl
      - bazel/kmp/metadata.bzl
      - bazel/kmp/native.bzl
      - bazel/kmp/native/extensions.bzl
      - bazel/kmp/native/properties.bzl
      - bazel/kmp/native/toolchain.bzl
      - bazel/kmp/sqlite/extensions.bzl

  # [2] — refreshViews/sourceAccountOverride/engineBatchSize are passed other values by callers in
  # the UI modules (and one Poi-typed test builder the linter can't resolve).
  - name: SameParameterValue
    paths:
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/CsvImportApplier.kt
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/CsvReimport.kt
      - app/qifimporter/src/commonMain/kotlin/com/moneymanager/qifimporter/QifReimport.kt
      # Production code builds these audit entries only through Mappie mappers, whose constructor
      # calls are generated at compile time, so the linter sees nothing but test fixtures' constants.
      - app/model/core/src/commonMain/kotlin/com/moneymanager/domain/model/AccountAuditEntry.kt
      - app/model/core/src/commonMain/kotlin/com/moneymanager/domain/model/PersonAccountOwnershipAuditEntry.kt

  # [4] — platform capability methods and an interface default that intentionally return a
  # constant (both platforms support every provider; non-token backends return null), plus test
  # fakes stubbing constants.
  - name: SameReturnValue
    paths:
      - app/importfilesource/di/src/androidMain/kotlin/com/moneymanager/importfilesource/di/CreateImportFileSourceFactory.android.kt
      - app/importfilesource/di/src/jvmMain/kotlin/com/moneymanager/importfilesource/di/CreateImportFileSourceFactory.jvm.kt
      - app/remotestorage/core/src/commonMain/kotlin/com/moneymanager/remotestorage/RemoteStorageProvider.kt
      - app/ui/imports/timeline/src/commonTest/kotlin/com/moneymanager/ui/screens/timeline/ImportTimelineScreenTest.kt
      - test/app/db/src/androidMain/kotlin/com/moneymanager/test/database/TestDatabaseHelper.kt
      # The JVM can't switch console modes, so its VT-enable actual is always true (Windows' actual isn't).
      - app/terminal/src/jvmMain/kotlin/com/moneymanager/terminal/TerminalFacts.jvm.kt
      # [1] — the Metro plugin test's fixture provides a constant so the test can assert the graph built it.
      - bazel/kmp/plugins/tests/src/commonMain/kotlin/com/moneymanager/bazel/plugins/Plugins.kt

  # [4] — deliberate no-op bodies: the Android onCreate-for-existing-DB branch and the Android
  # scrollbar actuals (Android has no desktop-style scrollbars).
  - name: EmptyMethod
    paths:
      - app/db/core/src/androidMain/kotlin/com/moneymanager/database/AndroidDatabaseManager.kt
      - utils/compose/scrollbar/src/androidMain/kotlin/com/moneymanager/compose/scrollbar/PlatformScrollbar.kt

  # Reviewed duplicates with no extractable abstraction: Mappie-template-shaped mapper pairs,
  # near-identical import/reimport orchestration blocks, and small repeated Compose fragments.
  - name: DuplicatedCode
    paths:
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/CsvImportApplier.kt
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/CsvReimport.kt
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/QifStagingConversion.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/OwnershipAuditHistoryForAccountMapper.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/TransferAuditEntryMapper.kt
      - app/importer/src/commonMain/kotlin/com/moneymanager/importer/ImportDeduper.kt
      - app/ui/imports/csv/src/commonMain/kotlin/com/moneymanager/ui/components/csv/CsvPreviewTable.kt
      - app/ui/imports/csv/src/commonMain/kotlin/com/moneymanager/ui/screens/csv/ReimportDialog.kt
      - app/ui/imports/csv/src/commonMain/kotlin/com/moneymanager/ui/screens/csvstrategy/editor/ConversionEditors.kt
      - app/ui/imports/importDirectory/src/commonMain/kotlin/com/moneymanager/ui/screens/importdirectory/ImportDirectoryAuditScreen.kt

  # "Initializer is redundant" fires on `val x = remember { ... }` / `LocalX.current` — a val
  # with its only initializer cannot have a redundant one. EAP false positive AND
  # nondeterministic: three consecutive identical scans flagged zero, then two, then two
  # different files (the linter's own sanity check reports the Kotlin inspections as suspect),
  # so it must be excluded wholesale — path entries just chase it around the codebase.
  - name: VariableInitializerIsRedundant

  # CryptographyProvider.get is not an operator fun, so the suggested indexing syntax doesn't
  # compile.
  - name: ReplaceGetOrSet
    paths:
      - app/csvimporter/src/commonMain/kotlin/com/moneymanager/csvimporter/Sha256.kt
      - utils/archive/src/commonMain/kotlin/com/moneymanager/archive/ArchiveCodec.kt
      - utils/rest/src/commonMain/kotlin/com/moneymanager/rest/ApiRequestSigner.kt

  # [1]+[2]+[4] — the unused-symbol family. Every entry verified: Metro providers/graph members
  # ([1]); expect/actual factories, platform impls and test fixtures consumed from other modules
  # ([2] — e.g. isDocumentTreeRef is called from app/importfilesource/di, getAuditableTables from
  # app/db/core tests, DbTest/TestProvenance from many modules' tests); interface-mandated override
  # parameters of fakes and no-op actuals ([4]); FieldMapping's `override val id` and the expect-fun
  # parameter of lastModifiedEpochMs (utils/files; every actual reads it), both reported as
  # "unused parameter".
  - name: unused
    paths:
      # revisionId in toDomain is unused by design (positional match for the generated mapper —
      # see the comment there); the in-code @Suppress can't carry the IDE's "unused" id because
      # RedundantSuppression then flags the detekt-only ids sharing the annotation.
      - app/db/repository/src/commonMain/kotlin/com/moneymanager/database/repository/CsvImportStrategyReadRepositoryImpl.kt
      - app/db/core/src/androidMain/kotlin/com/moneymanager/database/AndroidDatabaseManager.kt
      - app/db/di/src/androidMain/kotlin/com/moneymanager/database/di/CreateDatabaseManager.android.kt
      - app/db/di/src/commonMain/kotlin/com/moneymanager/database/di/DatabaseComponent.kt
      - app/db/di/src/commonMain/kotlin/com/moneymanager/database/di/DeviceIdModule.kt
      - app/db/di/src/commonMain/kotlin/com/moneymanager/database/di/RepositoryModule.kt
      - app/db/di/src/jvmMain/kotlin/com/moneymanager/database/di/CreateDatabaseManager.jvm.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/IdConversions.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/InstantConversions.kt
      - app/db/read/src/commonMain/kotlin/com/moneymanager/database/mapper/SourceTypeConversions.kt
      - app/db/write/src/commonMain/kotlin/com/moneymanager/database/write/MoneyManagerDatabaseWrapper.kt
      - app/di/core/src/commonMain/kotlin/com/moneymanager/di/AppComponent.kt
      - app/di/core/src/commonMain/kotlin/com/moneymanager/di/AppVersionModule.kt
      - app/importfilesource/core/src/commonMain/kotlin/com/moneymanager/importfilesource/ImportFileSource.kt
      - app/importfilesource/di/src/androidMain
      - app/importfilesource/di/src/jvmMain
      - app/importfilesource/localfolder/src/androidMain/kotlin/com/moneymanager/importfilesource/localfolder/SafFolderImportFileSource.kt
      - app/model/core/src/commonMain/kotlin/com/moneymanager/domain/model/DbLocation.kt
      - app/model/csvstrategy/src/commonMain/kotlin/com/moneymanager/domain/model/csvstrategy/FieldMapping.kt
      - app/remotestorage/di/src/androidMain
      - app/remotestorage/di/src/jvmMain
      - app/remotestorage/googledrive/src/commonMain/kotlin/com/moneymanager/remotestorage/googledrive/GoogleDriveProviderFactory.kt
      # [2] — the native browser launcher is wired by the CLI (#917), which this linter has no module for.
      - app/remotestorage/googledrive/src/nativeMain/kotlin/com/moneymanager/remotestorage/googledrive/SystemBrowserLauncher.kt
      - app/strategycatalog/src/commonTest/kotlin/com/moneymanager/strategycatalog/StrategyCatalogControllerTest.kt
      - app/ui/foundation/src/androidMain
      - app/ui/foundation/src/jvmMain
      # [4] — override parameters of the stub vault used when no LocalCredentialVault is provided.
      - app/ui/foundation/src/commonMain/kotlin/com/moneymanager/ui/foundation/LocalCredentialVault.kt
      # These five `block` parameters ARE used: each is invoked with receiver syntax
      # (`config.block()`, `accountMappings.block()`, ...), which this inspection does not
      # recognise, so it reports "Parameter 'block' is not used".
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/editor/AccountMappingsTab.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/editor/AdvancedTab.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/editor/ApiStrategyEditorState.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/editor/PeopleTab.kt
      - app/ui/imports/api/src/commonMain/kotlin/com/moneymanager/ui/screens/apistrategy/editor/TransactionMappingsTab.kt
      - app/ui/imports/timeline/src/commonTest/kotlin/com/moneymanager/ui/screens/timeline/ImportTimelineScreenTest.kt
      - test/app/db/src
      - utils/compose/scrollbar/src/androidMain/kotlin/com/moneymanager/compose/scrollbar/PlatformScrollbar.kt
      - utils/compose/scrollbar/src/jvmMain/kotlin/com/moneymanager/compose/scrollbar/PlatformScrollbar.kt
      - utils/files/src/commonMain/kotlin/com/moneymanager/files/Files.kt
      - utils/localsettings/di/src/androidMain
      - utils/localsettings/di/src/jvmMain
      - utils/localsettings/src/androidMain/kotlin/com/moneymanager/localsettings/AndroidLocalSettings.kt
      - utils/parsers/xlsx/src/jvmTest/kotlin/com/moneymanager/xlsx/XlsxParserTest.kt
      # [2] — the Google-account helpers are used by app/remotestorage/googledrive, the path-resolver
      # actuals by the vault's DI module, and the test vault by other modules' tests.
      - utils/credentialvault/src/commonMain/kotlin/com/moneymanager/credentialvault/CredentialBundle.kt
      - utils/credentialvault/di/src/androidMain
      - utils/credentialvault/di/src/jvmMain
      - test/utils/credentialvault/src
